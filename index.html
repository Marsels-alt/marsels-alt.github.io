<style>
/* VOICE: friendly and bubbly, native iOS with Liquid Glass. Glanceable, one-handed.
   IDEA: an iPhone app: content cards underneath, glass controls floating above them.
   PICTURE: one summary card leads (calories ring + slim macro bars); fiber and water share one row. Calm: red only for allergy danger, neutral shadows, no loops.
   COLOUR and TYPE: porcelain ground, cream Calora tile, cobalt accent, rose/amber/violet macros. SF Pro Rounded, system font fallback (no font downloads).
   LAYOUT: one 560px column; the glass tab bar floats at the bottom on phones and moves to the top on wide screens. */
:root{color-scheme:light dark;accent-color:var(--acc);
--bg:#F3F4FA;--card:#fff;--chip:#EEF0F7;--trk:#E8EAF2;--ink:#0E1020;--ink2:#5B6073;--sep:#ECEEF4;
--acc:#2B50F0;--acc2:#6A86FF;--acc-bg:#E6EBFF;--bad:#C40F2D;--bad-bg:#FFEDF0;
--sh:rgb(0 0 0/.13);--hi:rgb(255 255 255/.95);--edge:rgb(14 16 32/.06);--glass:rgb(255 255 255/.76);
--a1:#DDE4FF;--a2:#FCE8EF;--a3:#E3F5EC;--g1:#3A58EE;--g2:#2B50F0;
--pro:#E0479E;--carb:#FFAE1A;--fat:#9B5CFF;--fib:#1FB070;--wat:#18A9EE;--flame:#FF8A00;
--out:cubic-bezier(.16,1,.3,1);--r:28px;--gap:14px;
--font:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
@supports (color:light-dark(#000,#fff)){:root{
--bg:light-dark(#F3F4FA,#06070B);--card:light-dark(#fff,#14151C);--chip:light-dark(#EEF0F7,#21232D);--trk:light-dark(#E8EAF2,#272934);
--ink:light-dark(#0E1020,#F4F5FA);--ink2:light-dark(#5B6073,#A3A7B9);--sep:light-dark(#ECEEF4,#23252F);
--acc:light-dark(#2B50F0,#6F8CFF);--acc2:light-dark(#6A86FF,#9AAEFF);--acc-bg:light-dark(#E6EBFF,#1B2350);
--bad:light-dark(#C40F2D,#FF7088);--bad-bg:light-dark(#FFEDF0,#3A0F19);
--sh:light-dark(rgb(0 0 0/.13),rgb(0 0 0/.65));--hi:light-dark(rgb(255 255 255/.95),rgb(255 255 255/.07));--edge:light-dark(rgb(14 16 32/.06),rgb(255 255 255/.07));
--glass:light-dark(rgb(255 255 255/.76),rgb(28 30 40/.74));
--a1:light-dark(#DDE4FF,transparent);--a2:light-dark(#FCE8EF,transparent);--a3:light-dark(#E3F5EC,transparent);
--g1:light-dark(#3A58EE,#4A66F0);--g2:light-dark(#2B50F0,#2B49D8)}}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
:root[data-mode=light]{color-scheme:light}:root[data-mode=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);touch-action:manipulation}
html{scroll-padding:12px 0 calc(150px + env(safe-area-inset-bottom))}
body{margin:0;color:var(--ink);font:500 17px/1.4 var(--font);overflow-x:clip;-webkit-font-smoothing:antialiased;caret-color:var(--acc)}
::selection{background:color-mix(in srgb,var(--acc) 26%,transparent)}
html{scrollbar-color:color-mix(in srgb,var(--ink2) 45%,transparent) transparent}
p,.lead,.note,.sub,.msg,li{text-wrap:pretty}h1,h2,h3{text-wrap:balance}
.vh{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;background:radial-gradient(38% 28% at 12% 4%,var(--a1),transparent 70%),radial-gradient(34% 30% at 96% 34%,var(--a2),transparent 70%),radial-gradient(42% 30% at 24% 96%,var(--a3),transparent 70%),var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px;border-radius:12px}
svg.i{width:24px;height:24px;flex:none}
main{max-width:560px;margin:auto;padding:max(14px,env(safe-area-inset-top)) 18px calc(130px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;min-height:52px}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;letter-spacing:-.02em}
.date{color:var(--ink2);font-size:16px;margin:14px 2px 0}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin-top:2px}
h1{font-size:34px;line-height:1.08;margin:6px 0 0;font-weight:800;letter-spacing:-.03em}
h2{font-size:20px;margin:32px 4px 14px;font-weight:800;letter-spacing:-.02em}
h2.ct{font-size:19px;margin:0 0 4px;letter-spacing:0}
h3{font-size:19px;margin:0 0 4px;font-weight:800}
.lead{color:var(--ink2);margin:6px 2px 16px;font-size:16px}
.sub{color:var(--ink2);font-size:15px;font-weight:500}
.note{font-size:13px;color:var(--ink2);margin:10px 4px;font-weight:500}
.card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:inset 0 1px 0 var(--hi),0 0 0 1px var(--edge),0 18px 38px -22px var(--sh)}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(190%);-webkit-backdrop-filter:blur(22px) saturate(190%);box-shadow:inset 0 1px 0 var(--hi),inset 0 0 0 1px var(--edge),0 16px 40px -16px var(--sh)}
.bub{transition:transform .35s var(--out)}
.bub:active{transform:scale(.92);transition-duration:.12s}
.tbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:9px 16px;font-size:16px;font-weight:800;white-space:nowrap}
.pill svg{width:20px;height:20px;color:var(--flame)}
/* week */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin:20px 0 22px}
.week button{display:grid;justify-items:center;align-content:center;gap:0;padding:6px 0;border-radius:18px;min-height:54px;font-size:12px;color:var(--ink2);background:var(--card);box-shadow:inset 0 1px 0 var(--hi),0 0 0 1px var(--edge)}
.week b{font-size:16px;color:var(--ink);font-weight:800}
.week .t{box-shadow:inset 0 0 0 2px var(--acc)}

dialog{border:0;padding:0;margin:auto auto 0;width:min(560px,100%);max-width:100%;max-height:92dvh;overflow:auto;overscroll-behavior:contain;border-radius:34px 34px 0 0;background:var(--bg);color:var(--ink);box-shadow:0 -20px 60px -20px var(--sh);

<h1>Privacy Policy</h1>
<p class="sub">Last updated 25 November 2026</p>
<div class="card">
<h2>Who we are</h2>
<p>Calora is a calorie and macro tracker run by the Calora team in Latvia (European Union). We are responsible for your data (the "controller" under the GDPR). Questions? Email <a href="mailto:calora.scan@gmail.com">calora.scan@gmail.com</a>.</p>

<h2>What we collect</h2>
<ul>
<li><b>Your account:</b> your name and email address. If you choose "Continue with Google", Google shares your name and email address with us.</li>
<li><b>Health information you enter:</b> the food you log, small photos of meals you choose to save, water and weight entries, your goals and body details (sex, age, height and weight), your allergies, and your messages to the coach.</li>
<li><b>Support messages:</b> what you write to us through Help & support, and our replies.</li>
<li><b>Your choices:</b> appearance and text size settings, and when you agreed to this policy.</li>
</ul>
<p>We don't use advertising, tracking analytics or marketing emails, and we never sell your data.</p>

<h2>Why we use it</h2>
<ul>
<li>To run Calora for you: your account, syncing your data between your devices, and the app's features. This is needed to provide the service you asked for.</li>
<li>Your health information, only with your explicit consent, which you give before you start using Calora. You can withdraw it at any time with <b>Delete account</b> in Profile (or, without an account, <b>Delete all data on this device</b>).</li>
<li>To keep Calora safe, for example blocking accounts that abuse it.</li>
</ul>

<h2>How Calora uses AI</h2>
<ul>
<li><b>Photo recognition:</b> an AI model (CLIP, made by OpenAI) runs on your own device and suggests what food is in your photo. The photo isn't sent to us or anyone else to be analysed.</li>
<li><b>AI coach and label reading</b> (signed in only): when you message the coach, your message, recent chat, goals, today's food, allergies and the foods you log most are sent to Groq, an AI company, to write the reply. Groq is set not to store them (Zero Data Retention). Food label and meal photos are sent only after you agree, and Calora doesn't keep them. For recipes, what you type about your fridge is sent the same way. Calora counts how many AI requests you make each day to apply the daily limits.</li>
<li><b>Premium waitlist:</b> if you join it, we keep your email address so we can tell you when Premium is ready. You can leave it any time in Profile.</li>
<li><b>Barcode lookups:</b> when you scan or type a barcode, only its number is sent to Open Food Facts to find the product.</li>
<li><b>Products you add:</b> if a product is missing and you add it from its pack, its name, brand and nutrition are shared with everyone who uses Calora. Your name isn't shown; we keep which account added it so owners can remove misuse.</li>
<li><b>Typed meals and the coach:</b> these don't use AI. Calora matches what you type against its food list, and the built-in coach answers with fixed rules based on your goals and logs. Both run on your device.</li>
<li><b>Support replies:</b> we sometimes use an AI service to help draft a reply to your support message: Groq (running an open AI model), or Anthropic's Claude. Your conversation with us is processed by that service only to write the draft, and isn't used to train AI models. A person from the Calora team always reads, edits and sends the reply.</li>
<li><b>Inside the Claude app:</b> if you open Calora inside Anthropic's Claude app, the photos, meal descriptions and coach messages you send are processed by Anthropic's Claude AI to answer you, under Anthropic's privacy policy.</li>
</ul>
<p>AI results are estimates and can be wrong. Always check them.</p>

<h2>Photos</h2>
<p>When you log a scanned meal, a small thumbnail is saved with that day's log: on your device and, if you have an account, in your private account. Your photos are never put in public storage. (Images in our own news posts are public, because everyone can see them anyway.) Deleting the food, erasing your data or deleting your account removes the thumbnail.</p>

<h2>Where your data is stored</h2>
<p>With an account, your data is stored by Supabase in a data centre in the European Union. Row-level security means only you can read or change your data. Without an account, your data stays only in your browser on that device.</p>

<h2>Who else handles your data</h2>
<ul>
<li><b>Supabase Inc.</b>: database, sign-in and account emails (confirming your email, resetting your password).</li>
<li><b>Google LLC</b>: only if you choose "Continue with Google".</li>
<li><b>GitHub Inc.</b>: hosts this website (GitHub Pages).</li>
<li><b>jsDelivr</b> and <b>Hugging Face</b>: deliver the app's code libraries and, when you download it, the built-in AI model.</li>
<li><b>Groq, Inc.</b> or <b>Anthropic PBC</b>: only when we use AI to help draft a reply to a support message.</li>
</ul>
<p>Like any website, these services can see your IP address and basic browser details when your browser connects to them. Some are US companies. Where data leaves the EU, it's protected by the safeguards the GDPR requires, such as the EU's Standard Contractual Clauses.</p>
<p>The Calora team can see a list of accounts (name, email address, sign-in method, sign-up date and last sign-in), simple activity counts (how many days you've logged food and when you last used the app, never what you ate), and the support messages you send us. We use this to run, improve and protect the service. We don't look at your food logs, weight or other health information.</p>

<h2>Cookies and storage on your device</h2>
<p>Calora doesn't use cookies. It uses your browser's local storage to keep you signed in, save your data on the device, let you keep using your account offline, and keep the built-in AI model after you download it. These are all strictly necessary for features you ask for, so no cookie banner is needed. There's no advertising or analytics storage.</p>

<h2>How long we keep it</h2>
<p>Until you delete it. Deleting food, erasing your data or deleting your account removes it from our database straight away; deleting your account also deletes your support messages. Supabase may keep copies in its backups for a short time before they're overwritten.</p>

<h2>Your rights</h2>
<ul>
<li>See, correct or download your data, or ask us to delete it. Most of this you can do yourself in Profile; for anything else, email us and we'll reply within one month.</li>
<li><b>Delete account</b> at the bottom of Profile permanently deletes your account and all its data. Without an account, <b>Delete all data on this device</b> does the same on that device.</li>
<li>Withdraw your consent, or object to how we use your data, at any time.</li>
<li>Complain to Latvia's data protection authority, the Data State Inspectorate (<a href="https://www.dvi.gov.lv/en">dvi.gov.lv</a>), or to the authority in your own EU country.</li>
</ul>

<h2>Emails</h2>
<p>We only send emails you need for your account, such as confirming your email address or resetting your password. We don't send marketing emails, so there's nothing to unsubscribe from.</p>

<h2>Children</h2>
<p>Calora is for people aged 13 and older. If you're under 18, please use Calora together with a parent or guardian. If we learn that someone under 13 has an account, we'll delete it.</p>

<h2>Changes</h2>
<p>If this policy changes, we'll update this page and the date at the top, and tell you in the app if the change is important.</p>
</div>

let sb=null,authReady=!SB_ON,sync='idle',pushT=null,pushing=false,lastPull=0;
const A={view:'welcome',busy:'',err:'',info:'',email:'',f:{},show:false,cool:0,outForce:false};
const SHD={busy:false,err:''};
const appUrl=()=>location.origin+location.pathname;
const AUTH_MSG={invalid_credentials:"That email and password don't match. Check them and try again.",
 email_not_confirmed:'Please confirm your email address first. Check your inbox for the link.',
 user_already_exists:'An account with this email already exists. Try signing in instead.',email_exists:'An account with this email already exists. Try signing in instead.',

function authMsg(e){if(!e)return'';if(e.code&&AUTH_MSG[e.code])return AUTH_MSG[e.code];
 if(e.name==='AuthRetryableFetchError'||e.status===0||/failed to fetch|network|load failed/i.test(e.message||''))return"Can't connect to Calora's servers. Check your internet connection and try again.";
 if(e.name==='AuthSessionMissingError')return'Your link has expired. Please request a new one.';return e.message||'Something went wrong. Please try again.'}

async function initAuth(){if(!SB_ON){authReady=true;render();return maybeOnboard()}
 try{const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/+esm');
  sb=createClient(CALORA_CONFIG.supabaseUrl,CALORA_CONFIG.supabaseKey,{auth:{flowType:'pkce',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'calora-auth'}});
  const q=new URLSearchParams(location.search);
  const {error}=await sb.auth.getSession(); // also finishes sign-in from email and Apple links (?code=)
  if(error)A.err=authMsg(error);else if(q.get('error_description'))A.err=q.get('error_description');
  if(q.get('flow')==='recovery'&&!error)A.view='reset';
  const th=q.get('token_hash'),ty=q.get('type');
  if(th&&ty){const r=await sb.auth.verifyOtp({token_hash:th,type:ty});if(r.error)A.err=authMsg(r.error);else if(ty==='recovery')A.view='reset';else A.info='Your email is confirmed. Welcome to Calora!'}
  if([...q.keys()].length)history.replaceState(null,'',location.pathname+location.hash);
  sb.auth.onAuthStateChange((ev,session)=>setTimeout(()=>onAuth(ev,session),0)); // fires INITIAL_SESSION right away
  loadNews().catch(()=>{});
 }catch(e){ // library couldn't load (offline): keep the last account usable on this device; it syncs next time
  let last=null;try{last=JSON.parse(localStorage.getItem('calora:last'))}catch(_){}
  if(last){USER=last;S=loadState('calora:u:'+last.id);sync='offline'}else A.err="Can't connect to Calora's servers. Check your internet connection, or continue without an account.";
  authReady=true;render();syncNav();maybeOnboard()}}

async function onAuth(ev,session){const u=session?.user||null;
 if(ev==='PASSWORD_RECOVERY')A.view='reset';
 if(u&&(!USER||USER.id!==u.id)){USER={id:u.id,email:u.email||'',name:(u.user_metadata?.full_name||u.user_metadata?.name||'').slice(0,80),provider:u.app_metadata?.provider||'email'};
  try{localStorage.setItem('calora:last',JSON.stringify(USER))}catch(_){}
  S=loadState('calora:u:'+u.id);A.f={};A.err=A.view==='reset'?A.err:'';authReady=true;render();syncNav();await pull(true);maybeOnboard();checkAdmin().catch(()=>{});loadTickets().catch(()=>{});return}
 if(u&&ev==='USER_UPDATED'){USER.email=u.email||USER.email}
 if(!u&&USER&&ev==='SIGNED_OUT'){USER=null;S=loadState('calora');S.skipped=false;tab='today';history.replaceState(null,'','#today');A.view='welcome';A.outForce=false;sync='idle'}
 if(ev==='TOKEN_REFRESHED'&&authReady)return;
 authReady=true;render();syncNav();if(ev==='INITIAL_SESSION')maybeOnboard()}

const maybeOnboard=()=>{if(authReady&&A.view!=='reset'&&(USER||S.skipped)&&S.consent?.v===1&&!S.onboarded&&!$('#sheet').open)setTimeout(()=>{if(!$('#sheet').open&&!S.onboarded)openSheet('welcome')},300)};
const SYNC_TXT={synced:'Saved to your account',syncing:'Saving…',offline:"Offline. Changes will sync when you're back online.",idle:''};
function setSync(st){sync=st;const el=$('#syncstate');if(el)el.textContent=SYNC_TXT[st]}
const profPayload=()=>({display_name:USER?.name||null,settings:{goals:S.goals,profile:S.profile,allergies:S.allergies,other:S.other,theme:S.theme,size:S.size,onboarded:S.onboarded,start:S.start,consent:S.consent,goalsSet:S.goalsSet,favs:S.favs,meals:S.meals,rem:S.rem},weights:S.weights,chat:S.chat.slice(-40)});
function schedulePush(){clearTimeout(pushT);pushT=setTimeout(push,700)}

// download this user's data; keep local edits that haven't uploaded yet
async function pull(first){if(!sb||!USER||USER.offline)return;const uid=USER.id;lastPull=Date.now();setSync('syncing');
 const [p,d]=await Promise.all([sb.from('profiles').select('settings,weights,chat').eq('id',uid).maybeSingle(),sb.from('day_logs').select('day,items,water').eq('user_id',uid)]);
 if(!USER||USER.id!==uid)return;if(p.error||d.error){setSync('offline');return}
 const SY=S._sync||(S._sync={d:{},p:''});
 if(!p.data){ // brand-new account: bring this device's guest logs along, once
  const g=loadState('calora');if(first&&!S._migrated&&Object.keys(g.days).length){for(const k of['days','weights','goals','profile','allergies','other','onboarded','start','consent','goalsSet','favs','meals'])S[k]=g[k];S._migrated=true;toast('Your logs on this device are now saved to your account.')}
  save();await push();return}
 const localProfileChanged=SY.p&&SY.p!==JSON.stringify(profPayload());
 if(!localProfileChanged){Object.assign(S,p.data.settings||{});S.weights=p.data.weights||{};S.chat=p.data.chat||[]}
 const remote=new Set();
 for(const r of d.data){remote.add(r.day);const loc=S.days[r.day];if(loc&&SY.d[r.day]!==JSON.stringify(loc))continue;S.days[r.day]={items:r.items||[],water:r.water||0};SY.d[r.day]=JSON.stringify(S.days[r.day])}
 for(const k of Object.keys(S.days))if(!remote.has(k)&&SY.d[k]===JSON.stringify(S.days[k])){delete S.days[k];delete SY.d[k]} // deleted on another device
 if(!localProfileChanged)SY.p=JSON.stringify(profPayload());
 try{localStorage.setItem(curKey(),JSON.stringify(S))}catch(_){}render();await push()}

// upload what changed since the last successful sync
async function push(){if(!sb||!USER||USER.offline)return false;if(pushing){schedulePush();return false}pushing=true;const uid=USER.id,SY=S._sync||(S._sync={d:{},p:''});let ok=true;
 try{if(S._wipe){const {error}=await sb.from('day_logs').delete().eq('user_id',uid);if(error)ok=false;else{S._wipe=false;SY.d={}}}
  const rows=Object.entries(S.days).map(([k,v])=>[k,JSON.stringify(v)]).filter(([k,j])=>SY.d[k]!==j);
  if(ok&&rows.length){setSync('syncing');const {error}=await sb.from('day_logs').upsert(rows.map(([k])=>({user_id:uid,day:k,items:S.days[k].items||[],water:Math.round(S.days[k].water||0)})));if(error)ok=false;else rows.forEach(([k,j])=>SY.d[k]=j)}
  const pj=JSON.stringify(profPayload());if(ok&&SY.p!==pj){setSync('syncing');const {error}=await sb.from('profiles').upsert({id:uid,...JSON.parse(pj)});if(error)ok=false;else SY.p=pj}
 }catch(e){ok=false}
 pushing=false;if(USER&&USER.id===uid){try{localStorage.setItem(curKey(),JSON.stringify(S))}catch(_){}setSync(ok?'synced':'offline')}return ok}
addEventListener('online',()=>{if(USER)push()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&USER&&Date.now()-lastPull>30000)pull()});

async function authSubmit(kind){if(A.busy||!sb){if(!sb)authFail("Can't connect to Calora's servers. Check your internet connection.",'email');return}
 const f=A.f,email=(f.email||'').trim().toLowerCase(),pw=f.pw||'';A.err='';A.info='';
 if(kind!=='reset'&&!EMAIL_RE.test(email))return authFail('Please enter a valid email address.','email');
 if(kind==='signup'&&!(f.name||'').trim())return authFail('Please enter your name.','name');
 if(kind==='signin'&&!pw)return authFail('Please enter your password.','pw');
 if((kind==='signup'||kind==='reset')&&!pwOk(pw))return authFail('Use at least 8 characters, with letters and numbers.','pw');
 if(kind==='reset'&&pw!==f.pw2)return authFail("The two passwords don't match.",'pw2');
 A.busy=kind;render();
 try{if(kind==='signin'){const {error}=await sb.auth.signInWithPassword({email,password:pw});if(error){if(error.code==='email_not_confirmed'){A.view='check';A.email=email;A.f={email}}throw error}}
  if(kind==='signup'){const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{full_name:f.name.trim().slice(0,80)},emailRedirectTo:appUrl()}});if(error)throw error;if(!data.session){A.view='check';A.email=email;A.f={email};startCool()}}
  if(kind==='forgot'){const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:appUrl()+'?flow=recovery'});if(error)throw error;A.view='sent';A.email=email}
  if(kind==='reset'){const {error}=await sb.auth.updateUser({password:pw});if(error)throw error;A.view='welcome';A.f={};A.busy='';render();syncNav();toast("Password updated. You're signed in.");return maybeOnboard()}
 }catch(e){A.err=authMsg(e)}
 A.busy='';if(A.view!=='welcome'||!USER)render();if(A.err){const el=$('[aria-invalid]')||$(kind==='signin'?'#pw':'form input');el&&el.focus()}}

 case'back':A.f.pw=A.f.pw2='';return nav('welcome');

 if(i.allergens?.length)o.allergens=i.allergens;if(i.ingredients?.length)o.ingredients=i.ingredients;return o};

 for(const k of Object.keys(S.days).sort().reverse())for(const i of[...S.days[k].items].reverse()){if(seen.has(i.name))continue;seen.add(i.name);out.push(i);if(out.length>=n)return out}
 return out}

 toast(`Added ${it.name} to today`,()=>{const j=L.indexOf(it);if(j>=0)L.splice(j,1);save();render()})}

  S.favs.map((f,n)=>row(f.name,f.kcal,'Favourite','f:'+n,'f:'+n)).join('')+

// Photo of a barcode → the phone's own barcode reader if it has one, else a small WebAssembly reader
// (zxing-wasm, loaded once from jsDelivr). The number is looked up in Open Food Facts (ODbL).
// On unless an owner turns off "Barcode scanner" in /admin → Settings → App configuration.
const barcodeOn=()=>APPCFG.barcode!==false;
const ZXURL='https://cdn.jsdelivr.net/npm/zxing-wasm@2.2.4/dist/es/reader/index.js';
const OFFALG={'en:peanuts':'peanuts','en:nuts':'treenuts','en:milk':'dairy','en:eggs':'eggs','en:gluten':'gluten','en:fish':'fish','en:crustaceans':'shellfish','en:molluscs':'shellfish','en:soybeans':'soy','en:sesame-seeds':'sesame'};

async function readBarcode(file){
 if('BarcodeDetector' in window)try{const r=await new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']}).detect(await createImageBitmap(file));if(r[0])return r[0].rawValue}catch(e){}
 const z=await import(ZXURL),r=await z.readBarcodes(file,{formats:['EAN-13','EAN-8','UPC-A','UPC-E'],tryHarder:true,maxNumberOfSymbols:1});return r[0]?.text||''}

// one serving if the pack says how big it is, otherwise 100 g. x holds values per 100 g.
function packItem(x,code,src){const g=+x.serving_g||0,k=g?g/100:1,name=[x.name,x.brand].filter(Boolean).join(' · ')||'Product '+code;
 return setQ({id:uid(),name:`${name.slice(0,64)} (${g?r(g):100} g)`,b:{kcal:x.kcal*k,p:x.p*k,c:x.c*k,f:x.f*k,fib:(x.fib||0)*k},st:.5,ingredients:x.ingredients||[],allergens:x.allergens||[],code,src},1)}
function offItem(p,code){const n=p.nutriments||{},v=x=>+n[x+'_100g']||0;
 return packItem({name:p.product_name,brand:(p.brands||'').split(',')[0].trim(),serving_g:+p.serving_quantity||0,kcal:n['energy-kcal_100g']!=null?v('energy-kcal'):v('energy')/4.184,
  p:v('proteins'),c:v('carbohydrates'),f:v('fat'),fib:v('fiber'),ingredients:p.ingredients_text?[String(p.ingredients_text).slice(0,600)]:[],allergens:(p.allergens_tags||[]).map(t=>OFFALG[t]).filter(Boolean)},code,'off')}

async function lookupBarcode(code){code=String(code||'').replace(/\D/g,'');SH.nf='';SH.code=code;
 if(code.length<8||code.length>14){SH.err='Enter the 8 to 14 digits printed under the barcode.';return renderSheet()}
 Object.assign(SH,{busy:true,err:'',items:null,code});renderSheet();
 try{const j=await(await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}?fields=product_name,brands,serving_quantity,nutriments,allergens_tags,ingredients_text`)).json(),p=j.status===1&&j.product,n=p&&p.nutriments;
  if(n&&(n['energy-kcal_100g']!=null||n.energy_100g!=null))SH.items=[offItem(p,code)];
  else{const {data:pr}=sb?await sb.from('products').select('*').eq('barcode',code).maybeSingle():{};  // Calora's own list: products other customers added
   if(pr)SH.items=[packItem(pr,code,'calora')];else{SH.err=`This product isn't in Open Food Facts or Calora yet (${code}).`;SH.nf=code}}}
 catch(e){SH.err="Couldn't reach Open Food Facts. Check your connection and try again."}
 SH.busy=false;if($('#sheet').open&&sheetKind==='log'&&SH.mode==='barcode')renderSheet()}

async function scanBarcodePhoto(file){Object.assign(SH,{busy:true,err:'',items:null,nf:''});renderSheet();let code='';
 try{code=await readBarcode(file)}catch(e){}
 if(code)return lookupBarcode(code);
 SH.busy=false;SH.err="Couldn't read a barcode in that photo. Try again closer and in good light, or type the number.";renderSheet()}

 <div class="fields" style="margin-top:12px"><label class="f w">Or type the number under the barcode<input type="text" id="barnum" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="e.g. 5000159407236" value="${esc(SH.code||'')}"></label></div>

 <button class="link bub" data-mode="scan" style="min-height:44px;margin-top:4px">Take a food photo instead</button>`;

  :`<p class="note">Product data from <a class="link" href="https://world.openfoodfacts.org/product/${it.code}" target="_blank" rel="noopener">Open Food Facts</a>, shared under the Open Database License. Check the pack if something looks off.</p>`};

 :`<button class="btn sec bub" data-mode="manual" data-pre="Product ${code}">Add it manually</button><p class="note">Sign in to add missing products for everyone.</p>`;

 if(P.busy)return shh('Add a product')+`<p class="lead" role="status">Reading the label…</p>`;
 return shh('Add a product')+`<p class="sub" style="margin:0 4px 12px">Barcode ${esc(P.code)}. Copy the <b>per 100 g</b> column from the pack${P.ai?'. The AI filled it in; please check every number':''}.</p>
 <div class="fields">${f('name','Product name',esc(P.name||''),1)}${f('brand','Brand (optional)',esc(P.brand||''),1)}${f('kcal','Calories (kcal)',P.kcal)}${f('p','Protein (g)',P.p)}${f('c','Carbs (g)',P.c)}${f('f','Fat (g)',P.f)}${f('fib','Fiber (g)',P.fib)}${f('serving','Serving size (g, optional)',P.serving_g)}</div>
 <p class="sub" style="margin:14px 4px 8px">Allergens listed on the pack</p><div class="chips">${Object.entries(ALG).map(([k,[l]])=>`<button class="chip bub" data-palg="${k}" aria-pressed="${(P.allergens||[]).includes(k)}">${l}</button>`).join('')}</div>

 <p class="note">Shared with everyone who uses Calora, without your name. Owners can correct it.</p>`}

async function saveProduct(){keepProdFields();const num=k=>+String(PROD[k]??'').replace(',','.').trim(),P=PROD;
 const pr={barcode:P.code,name:String(P.name||'').trim().slice(0,80),brand:String(P.brand||'').trim().slice(0,60)||null,serving_g:num('serving_g')||null,kcal:num('kcal'),p:num('p'),c:num('c'),f:num('f'),fib:num('fib'),allergens:P.allergens||[]};
 const bad=!pr.name?'Add the product name.':[pr.kcal,pr.p,pr.c,pr.f,pr.fib].some(x=>!isFinite(x)||x<0)||pr.kcal>900||[pr.p,pr.c,pr.f,pr.fib].some(x=>x>100)?'Check the numbers: per 100 g, calories go up to 900 and the others up to 100.':pr.p+pr.c+pr.f+pr.fib>105?"Protein, carbs, fat and fiber can't add up to more than 100 g.":'';
 if(bad){P.err=bad;return renderSheet()}

 const it=packItem(pr,pr.barcode,'calora');delete it.b;delete it.st;addItems([it])}
function readPackLabel(){LABELNEXT='prodfile';if(!S.labelOK)return openSheet('label');$('#prodfile').click()}

// ---------- coach ----------
const ACT={sedentary:1.2,light:1.375,moderate:1.55,very:1.725,athlete:1.9};
const noCut=p=>p.age<18||p.weight/(p.height/100)**2<18.5; // teens and underweight people keep their weight steady
function calcGoals(p){const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==='male'?5:-161);let kcal=bmr*ACT[p.activity]+(p.goal==='lose'?(noCut(p)?0:-500):p.goal==='build'?300:0);kcal=r(Math.max(kcal,p.sex==='male'?1500:1200)/10)*10;
 const pr=r(p.weight*(p.goal==='build'?2:p.goal==='lose'?1.8:1.6)),f=r(kcal*.27/9);return{kcal,p:pr,c:Math.max(0,r((kcal-pr*4-f*9)/4)),f,fib:r(kcal/1000*14),water:r(p.weight*35/100)*100}}
const goalLine=g=>`**${fmt(g.kcal)} kcal** a day: ${g.p}g protein, ${g.c}g carbs, ${g.f}g fat, ${g.fib}g fiber and ${+(g.water/1000).toFixed(1)}L water.`;
// Calora's built-in coach: works on this device without Claude
function localCoach(t){const s=t.toLowerCase(),p=S.profile,g=S.goals,su=sum(T),kl=g.kcal-su.kcal,pl=g.p-su.p;
 const num=re=>{const m=s.match(re);return m?parseFloat(m[1].replace(',','.')):null};
 const h=num(/(\d{3})\s*cm/),w=num(/(\d{2,3}(?:[.,]\d)?)\s*kg/),a=num(/(\d{2})\s*(?:y\/?o\b|years?|yrs?)/);
 const goal=/lose|cut\b|drop|slim|fat loss/.test(s)?'lose':/muscle|bulk|gain|bigger|stronger/.test(s)?'build':/maintain|keep my weight/.test(s)?'maintain':null;
 const ideas=(n,lim)=>FOODS.filter(f=>f.k*f.d>40&&f.k*f.d<=lim&&!flags(mk(f)).length&&!/filet mignon|foie|prime rib|scallop|lobster|escargot|carpaccio|tartare|peking|oyster|crab|bisque|baby back|caviar/.test(f.n)).sort((x,y)=>y.p/y.k-x.p/x.k).slice(0,12).sort(()=>Math.random()-.5).slice(0,n).map(f=>`- ${qn(f)}: **${r(f.p*f.d)}g protein**, ${r(f.k*f.d)} kcal`).join('\n');
 const hasAl=S.allergies.length||others().length;
 if(h&&w&&a){Object.assign(p,{height:h,weight:w,age:a});if(/female|woman|\bgirl|\bshe\b/.test(s))p.sex='female';else if(/\bmale\b|\bman\b|\bguy\b|\bhe\b/.test(s))p.sex='male';if(goal)p.goal=goal;
  const lose=num(/lose\s*(\d+(?:[.,]\d)?)\s*kg/),gain=num(/gain\s*(\d+(?:[.,]\d)?)\s*kg/),tooLow=lose&&(w-lose)/(h/100)**2<18.5;if(lose&&!tooLow)p.target=+(w-lose).toFixed(1);else if(gain)p.target=+(w+gain).toFixed(1);

function weightTrendHTML(){const ws=Object.entries(S.weights||{}).sort(),cut=add(T,-28),last=ws.filter(([k])=>k>=cut);
 if(last.length<3)return ws.length>=2?`<p class="note" style="margin:10px 0 0">Log your weight on 3 or more days over a week or two to see your pace.</p>`:'';
 const t=k=>Date.parse(k)/864e5,n=last.length,mx=last.reduce((a,[k])=>a+t(k),0)/n,my=last.reduce((a,[,w])=>a+w,0)/n,
  sxx=last.reduce((a,[k])=>a+(t(k)-mx)**2,0);if(t(last[n-1][0])-t(last[0][0])<7)return`<p class="note" style="margin:10px 0 0">Keep logging: your pace shows once your weigh-ins cover at least a week.</p>`;
 const slope=last.reduce((a,[k,w])=>a+(t(k)-mx)*(w-my),0)/sxx,wk=slope*7,now=my+slope*(t(T)-mx),p=S.profile,tg=+p.target,bmi=p.height?now/((p.height/100)**2):0;
 let msg=`Over the last 4 weeks: ${Math.abs(wk)<0.05?'about steady':`${wk<0?'down':'up'} ${Math.abs(wk).toFixed(1)} kg a week`}.`;
 if(tg&&Math.abs(now-tg)>=0.5){const toward=(tg-now)*wk>0;
  if(Math.abs(wk)<0.05)msg+=` To reach ${tg} kg you'd need a steady trend first.`;
  else if(!toward)msg+=` That's moving away from your ${tg} kg goal for now.`;
  else if(tg<now&&(+p.age<18||bmi<18.5))msg+='';  // no weight-loss forecasts for under-18s or a low BMI
  else{const d=new Date(Date.now()+(tg-now)/wk*7*864e5);msg+=` At this pace you'd reach ${tg} kg around ${d.toLocaleDateString('en-GB',{day:'numeric',month:'long',...(d.getFullYear()!==new Date().getFullYear()?{year:'numeric'}:{})})}.`;
   if(wk<0&&-wk>now*0.01)msg+=' That\'s faster than the usual safe pace of about 0.5 to 1 kg a week.'}}
 return`<p class="sub" style="margin:10px 0 0" role="status">${msg} This is an estimate from your weigh-ins, not a promise.</p>`}
