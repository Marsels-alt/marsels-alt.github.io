<style>
/* Calora Admin. Shopify-style structure, Calora's dark palette: near-black, navy, slate, deep crimson.
   Crimson is only used for fills and indicators (white text on top), never as thin text on dark. */
:root{--bg:#0A0D14;--side:#0D1320;--card:#111B2B;--card2:#16223A;--line:#242D3B;--input:#0C1424;--slate:#242D3B;
  --text:#F2F4F8;--muted:#A3ABBA;--acc:#681B25;--acc2:#7D2330;--acc-soft:rgba(104,27,37,.32);--focus:#C8CEDA;
  --ok:#5CC48F;--warn:#E3B04B;--bad:#F08C96;--info:#8FB3FF;--s1:#7F95BF;--s2:#B5475A;
  --r:10px;--shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.28);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color-scheme:dark}
[data-theme=light]{--bg:#F5F6F8;--side:#EBEDF1;--card:#FFFFFF;--card2:#F3F4F7;--line:#E2E5EA;--input:#FFFFFF;--slate:#E6E9EE;
  --text:#10141C;--muted:#5A6272;--acc-soft:rgba(104,27,37,.10);--focus:#3A4250;--ok:#1E7A4F;--warn:#8A5A00;--bad:#A3202F;--info:#2A5BC4;
  --s1:#4A63A0;--s2:#8E2A3A;--shadow:0 1px 2px rgba(16,20,28,.06),0 4px 14px rgba(16,20,28,.05);color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.boot{min-height:100vh;display:grid;place-items:center}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(1turn)}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;transition:grid-template-columns .22s ease}
.shell.col{grid-template-columns:72px minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden auto;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:16px 18px 14px;font-weight:700;font-size:15px;white-space:nowrap}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.nav{padding:4px 10px 12px;display:grid;gap:2px}
.nav h3{margin:14px 10px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;white-space:nowrap}
.nav a{position:relative;display:flex;align-items:center;gap:12px;min-height:38px;padding:0 10px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:550;white-space:nowrap;transition:background .15s,color .15s}
.nav a:hover{background:var(--card2);color:var(--text)}
.nav a[aria-current]{background:var(--slate);color:var(--text)}
.nav a[aria-current]::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--acc)}
.nav .dot{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--acc);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.shell.col .nav h3,.shell.col .lbl,.shell.col .brand span,.shell.col .nav .dot{display:none}
.shell.col .nav a{justify-content:center}
.side-foot{margin-top:auto;padding:10px;border-top:1px solid var(--line)}
.side-foot button{width:100%;display:flex;align-items:center;gap:12px;min-height:38px;padding:0 10px;border-radius:8px;color:var(--muted)}
.side-foot button:hover{background:var(--card2);color:var(--text)}
.shell.col .side-foot button{justify-content:center}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .menu{display:none}
.search{position:relative;flex:1;max-width:560px}
.search svg.i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input[type=search]{width:100%;height:38px;min-height:38px;padding:0 12px 0 36px;border-radius:8px;border:1px solid var(--line);background:var(--input)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:11px var(--font);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.results{position:absolute;top:44px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);max-height:70vh;overflow:auto;padding:6px;z-index:40}
.results h4{margin:8px 10px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.results a{display:flex;justify-content:space-between;gap:12px;padding:8px 10px;border-radius:6px;text-decoration:none}
.results a:hover,.results a:focus{background:var(--card2)}
.tb{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;color:var(--muted);position:relative}
.tb:hover{background:var(--card2);color:var(--text)}
.tb .badge{position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--acc);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.pop{position:absolute;right:0;top:46px;width:min(380px,92vw);background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);z-index:40;overflow:hidden}
.pop header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:650}
.pop .list{max-height:60vh;overflow:auto}
.pop .n{display:flex;gap:10px;padding:10px 14px;text-decoration:none;border-bottom:1px solid var(--line)}
.pop .n:hover{background:var(--card2)}
.pop .n.unread b::after{content:"";display:inline-block;width:7px;height:7px;margin-left:6px;border-radius:50%;background:var(--s2);vertical-align:2px}
.page{padding:24px;max-width:1240px;width:100%;margin:0 auto}
.page:focus{outline:none}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{margin:0;font-size:22px;line-height:1.3;font-weight:700}
.ph p{margin:4px 0 0;color:var(--muted)}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;margin-bottom:8px;min-height:32px}
.back:hover{color:var(--text)}

/* ---------- building blocks ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card>header h2{margin:0;font-size:15px;font-weight:650}
.card>header a{color:var(--muted);text-decoration:none;font-size:13px}

/* modal + toast + login */
dialog#modal{width:min(560px,94vw);max-height:90vh;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);box-shadow:0 30px 80px rgba(0,0,0,.5)}

async function loadPlans(){S.plans=await run(sb.from('plans').select('*').order('sort').order('price_cents'));return S.plans}
async function upload(bucket,file,prefix){if(file.size>(bucket==='media'?5:10)*1048576)throw new Error(`That file is too big (max ${bucket==='media'?5:10} MB).`);
  const ext=(file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5),path=`${prefix}/${crypto.randomUUID()}.${ext}`;
  const{error}=await sb.storage.from(bucket).upload(path,file,{contentType:file.type||undefined,upsert:false});if(error)throw fail(error);return path}
const publicUrl=path=>sb.storage.from('media').getPublicUrl(path).data.publicUrl;

let toastT;
function toast(msg,bad){const t=$('#toast');t.textContent=msg;t.className='on'+(bad?' bad':'');clearTimeout(toastT);toastT=setTimeout(()=>t.className='',bad?5200:3000)}
async function busy(btn,fn){if(btn?.disabled)return;const old=btn?.innerHTML;if(btn){btn.disabled=true;btn.innerHTML=`<span class="spin" aria-hidden="true"></span>${btn.dataset.busy||'Working…'}`}
  try{return await fn()}catch(e){toast(e.message||'Something went wrong',1);console.error(e)}finally{if(btn&&btn.isConnected){btn.disabled=false;btn.innerHTML=old}}}
function modal({title,body,actions='',wide}){const d=$('#modal');d.style.width=wide?'min(820px,96vw)':'';
  d.innerHTML=`<header><h2 id="modal-title">${esc(title)}</h2><button class="tb" data-act="modal-close" aria-label="Close">${I('x')}</button></header><div class="mb">${body}</div>${actions?`<footer>${actions}</footer>`:''}`;
  if(!d.open)d.showModal();setTimeout(()=>$('#modal [autofocus]')?.focus(),30);return d}
const closeModal=()=>{const d=$('#modal');if(d.open)d.close()};
function confirmBox(title,text,{ok='Confirm',danger,typed}={}){return new Promise(res=>{
  modal({title,body:`<p class="help" style="color:var(--text)">${text}</p>${typed?`<label class="f">Type <code>${esc(typed)}</code> to confirm<input type="text" id="cb-typed" autocomplete="off" autofocus></label>`:''}`,
    actions:`<button class="btn" data-cb="no">Cancel</button><button class="btn ${danger?'pri':'pri'}" data-cb="yes" ${typed?'disabled':''} ${typed?'':'autofocus'}>${esc(ok)}</button>`});
  const d=$('#modal'),done=v=>{d.removeEventListener('click',on);d.removeEventListener('close',cl);if(d.open)d.close();res(v)};
  const on=e=>{const b=e.target.closest('[data-cb]');if(b)done(b.dataset.cb==='yes')},cl=()=>done(false);
  d.addEventListener('click',on);d.addEventListener('close',cl);
  if(typed)$('#cb-typed').addEventListener('input',e=>$('[data-cb=yes]').disabled=e.target.value.trim()!==typed)})}

const kpi=(label,value,small='',delta='')=>`<div class="card kpi${value==null?' na':''}"><span>${esc(label)}</span><b>${value==null?'Not available':value}</b>${delta}${small?`<small>${small}</small>`:''}</div>`;
function delta(now,prev,inverse){if(prev==null||now==null)return'';if(!prev&&!now)return'<span class="delta flat">No change</span>';
  if(!prev)return`<span class="delta ${inverse?'down':'up'}">New vs. 0 before</span>`;const d=Math.round((now-prev)/prev*1000)/10,up=d>0;
  return`<span class="delta ${d===0?'flat':(up!==!!inverse)?'up':'down'}">${d>0?'+':''}${d}% vs previous period</span>`}

// ---------- charts (SVG, no libraries) ----------
function niceMax(v){if(v<=4)return 4;const p=10**Math.floor(Math.log10(v)),n=v/p;return(n<=1?1:n<=2?2:n<=5?5:10)*p}
function lineChart(pts,series,{h=220,label='Chart',fmtX=d=>new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}={}){
  if(!pts.length)return empty('chart','No data yet','');
  const W=640,L=36,R=12,T=12,B=26,max=niceMax(Math.max(1,...pts.flatMap(p=>series.map(s=>+p[s.key]||0)))),x=i=>L+(pts.length<2?(W-L-R)/2:i*(W-L-R)/(pts.length-1)),y=v=>T+(h-T-B)*(1-v/max);
  const grid=[0,.25,.5,.75,1].map(f=>`<line x1="${L}" x2="${W-R}" y1="${y(max*f)}" y2="${y(max*f)}"/><text x="${L-6}" y="${y(max*f)+4}" text-anchor="end">${num(Math.round(max*f))}</text>`).join('');
  const lines=series.map((s,si)=>{const d=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(+p[s.key]||0).toFixed(1)}`).join('');
    return(si===0?`<path d="${d}L${x(pts.length-1)},${y(0)}L${x(0)},${y(0)}Z" fill="${s.color}" opacity=".12"/>`:'')+`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round"/>`+
      pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(+p[s.key]||0)}" r="${pts.length>40?0:3}" fill="${s.color}"><title>${esc(fmtX(p.t))}: ${num(p[s.key])} ${esc(s.label)}</title></circle>`).join('')}).join('');
  const ticks=[0,Math.floor((pts.length-1)/2),pts.length-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>`<text x="${x(i)}" y="${h-6}" text-anchor="${i===0?'start':i===pts.length-1?'end':'middle'}">${esc(fmtX(pts[i].t))}</text>`).join('');
  const sum=series.map(s=>`${s.label}: ${num(pts.reduce((a,p)=>a+(+p[s.key]||0),0))} total`).join('; ');
  return`<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(label)}. ${esc(sum)}"><g class="grid">${grid}</g>${lines}${ticks}</svg>
    <div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join('')}</div>`}
function barChart(pts,key,color,{h=200,label='Chart',fmtX}={}){
  if(!pts.length)return empty('chart','No data yet','');fmtX=fmtX||(d=>new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'}));
  const W=640,L=36,R=8,T=12,B=26,max=niceMax(Math.max(1,...pts.map(p=>+p[key]||0))),bw=(W-L-R)/pts.length,y=v=>T+(h-T-B)*(1-v/max);
  const grid=[0,.5,1].map(f=>`<line x1="${L}" x2="${W-R}" y1="${y(max*f)}" y2="${y(max*f)}"/><text x="${L-6}" y="${y(max*f)+4}" text-anchor="end">${num(Math.round(max*f))}</text>`).join('');
  const bars=pts.map((p,i)=>{const v=+p[key]||0;return`<rect x="${(L+i*bw+bw*.15).toFixed(1)}" y="${y(v).toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${(y(0)-y(v)).toFixed(1)}" rx="3" fill="${color}"><title>${esc(fmtX(p.t))}: ${num(v)}</title></rect>`}).join('');
  const ticks=[0,pts.length-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>`<text x="${L+i*bw+bw/2}" y="${h-6}" text-anchor="${i?'end':'start'}">${esc(fmtX(pts[i].t))}</text>`).join('');
  return`<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(label)}: ${num(pts.reduce((a,p)=>a+(+p[key]||0),0))} total"><g class="grid">${grid}</g>${bars}${ticks}</svg>`}
function donut(parts,{label='Chart',center=''}={}){const tot=parts.reduce((a,p)=>a+p.value,0);if(!tot)return empty('chart','No data yet','');
  let a=0;const R=54,C=2*Math.PI*R,segs=parts.filter(p=>p.value).map(p=>{const len=p.value/tot*C,s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${p.color}" stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-a}" transform="rotate(-90 70 70)"><title>${esc(p.label)}: ${num(p.value)}</title></circle>`;a+=len;return s}).join('');
  return`<div class="donut-wrap"><svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="${esc(label)}: ${esc(parts.map(p=>p.label+' '+num(p.value)).join(', '))}"><circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--line)" stroke-width="18"/>${segs}<text x="70" y="75" text-anchor="middle" style="fill:var(--text);font-size:16px;font-weight:700">${esc(center)}</text></svg>
   <div class="legend" style="display:grid;gap:6px">${parts.map(p=>`<span><i style="background:${p.color}"></i>${esc(p.label)}: <b style="color:var(--text)">${num(p.value)}</b> (${pct(p.value,tot)})</span>`).join('')}</div></div>`}

function wireSearch(){const inp=$('#gsearch'),box=$('#gresults');let t,seq=0;
  inp.addEventListener('input',()=>{clearTimeout(t);const q=inp.value.trim();if(q.length<2){box.hidden=true;return}t=setTimeout(async()=>{const my=++seq;
    const like=`%${q.replace(/[%_,()"'\\]/g,' ')}%`;const[c,p,i,s,k]=await Promise.allSettled([rpc('admin_customers',{p_q:q,p_limit:5}),run(sb.from('posts').select('id,title').ilike('title',like).limit(5)),
      run(sb.from('ideas').select('id,title').ilike('title',like).limit(5)),run(sb.from('support_tickets').select('id,subject,email').or(`subject.ilike.${like},email.ilike.${like}`).limit(5)),run(sb.from('promo_codes').select('id,code').ilike('code',like).limit(5))]);
    if(my!==seq)return;const v=r=>r.status==='fulfilled'?r.value:null,grp=(t,items)=>items?.length?`<h4>${t}</h4>`+items.join(''):'';
    const html=grp('Customers',v(c)?.rows?.map(r=>`<a href="#/customers/${r.id}">${esc(r.name||r.email)}<span class="sub" style="color:var(--muted)">${esc(r.email)}</span></a>`))+
      grp('News',v(p)?.map(r=>`<a href="#/news/${r.id}">${esc(r.title)}</a>`))+grp('Ideas',v(i)?.map(r=>`<a href="#/ideas/${r.id}">${esc(r.title)}</a>`))+
      grp('Support',v(s)?.map(r=>`<a href="#/support/${r.id}">${esc(r.subject)}<span style="color:var(--muted)">${esc(r.email||'')}</span></a>`))+grp('Promo codes',v(k)?.map(r=>`<a href="#/promos">${esc(r.code)}</a>`));
    box.innerHTML=html||`<div class="empty" style="padding:16px">No results for “${esc(q)}”.</div>`;box.hidden=false},250)});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const a=$('#gresults a');if(a){location.hash=a.getAttribute('href');box.hidden=true;inp.blur()}}if(e.key==='Escape'){box.hidden=true;inp.blur()}});
  box.addEventListener('click',e=>{if(e.target.closest('a')){box.hidden=true;inp.value=''}})}

function periodRange(k){const now=new Date();
  if(k==='weekly')return{from:daysAgo(83),to:now,bucket:'week'};if(k==='monthly'){const f=new Date(now.getFullYear(),now.getMonth()-11,1);return{from:f,to:now,bucket:'month'}}
  if(k==='yearly')return{from:new Date(now.getFullYear()-2,0,1),to:now,bucket:'month',year:1};return{from:daysAgo(29),to:now,bucket:'day'}}
async function series({from,to,bucket,year}){const r=await rpc('admin_series',{p_from:from.toISOString(),p_to:to.toISOString(),p_bucket:bucket});
  if(year){const m={};for(const b of r.buckets){const y=new Date(b.t).getFullYear();m[y]=m[y]||{t:new Date(y,0,1).toISOString(),signups:0,active:0,tickets:0,redemptions:0};for(const k of['signups','tickets','redemptions'])m[y][k]+=b[k];m[y].active=Math.max(m[y].active,b.active)}r.buckets=Object.values(m)}
  return r}

  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

// ================= Customer Support Inbox =================
const SU={tab:'open',q:'',pri:'',who:''};let TICKETS=[];
const PRIO={low:['Low',''],normal:['Normal',''],high:['High','warn'],urgent:['Urgent','bad']};
PAGES.support=async id=>{if(id)return ticketPage(id);TICKETS=await run(sb.from('support_tickets').select('*').order('last_message_at',{ascending:false}).limit(500));refreshCounts();
  const n=k=>TICKETS.filter(t=>k==='all'||t.status===k).length;
  return`<div class="ph"><div><h1>Customer Support Inbox</h1><p>Messages customers send from the Calora app. Your replies appear in their app.</p></div></div>
  <section class="card"><div class="tabs" role="tablist" style="padding:0 12px;margin:0">${['open','pending','resolved','all'].map(k=>`<button role="tab" data-act="su-tab" data-k="${k}" aria-selected="${SU.tab===k}">${k[0].toUpperCase()+k.slice(1)} (${n(k)})</button>`).join('')}</div>
   <div class="bar"><div class="grow search" style="max-width:none">${I('search')}<input type="search" id="su-q" value="${esc(SU.q)}" placeholder="Search subject, name or email" aria-label="Search tickets"></div>
    <select data-input="su-f" data-k="pri" aria-label="Priority" style="width:auto"><option value="">Any priority</option>${opts(PRIO,SU.pri)}</select>
    <select data-input="su-f" data-k="who" aria-label="Assigned" style="width:auto"><option value="">Anyone</option><option value="me" ${SU.who==='me'?'selected':''}>Assigned to me</option><option value="none" ${SU.who==='none'?'selected':''}>Unassigned</option></select></div><div id="su-list">${ticketRows()}</div></section>`};
function ticketRows(){const q=SU.q.toLowerCase(),L=TICKETS.filter(t=>(SU.tab==='all'||t.status===SU.tab)&&(!SU.pri||t.priority===SU.pri)&&(!SU.who||(SU.who==='me'?t.assigned_to===S.user.email:!t.assigned_to))&&(!q||(t.subject+' '+(t.name||'')+' '+(t.email||'')).toLowerCase().includes(q)));
  return L.length?L.map(t=>`<a class="list-row" href="#/support/${t.id}"><span class="avatar" style="width:32px;height:32px;background:var(--slate);color:var(--text)">${esc(initials(t.name||t.email))}</span><span class="grow"><b>${esc(t.subject)}</b><span>${esc(t.name||'')} ${esc(t.email||'')} · ${ago(t.last_message_at)}${t.last_from_admin?' · you replied':' · waiting for you'}${t.assigned_to?` · ${esc(ADMIN_NAMES[t.assigned_to]||t.assigned_to)}`:''}</span></span>${t.priority!=='normal'?chip(...PRIO[t.priority]):''}${statusChip(t.status)}</a>`).join('')
   :empty('inbox',TICKETS.length?'No tickets here':'No support tickets yet',TICKETS.length?'':'When customers use Help & support in the app, their messages land here.')}
ACT['su-tab']=b=>{SU.tab=b.dataset.k;$$('[data-act=su-tab]').forEach(x=>x.setAttribute('aria-selected',x===b));$('#su-list').innerHTML=ticketRows()};
INPUT['su-f']=e=>{SU[e.target.dataset.k]=e.target.value;$('#su-list').innerHTML=ticketRows()};
MOUNT.support=id=>{if(!id)$('#su-q').addEventListener('input',e=>{SU.q=e.target.value;$('#su-list').innerHTML=ticketRows()})};
let TK=null;
async function ticketPage(id){const[t,msgs,sup,admins]=await Promise.all([run(sb.from('support_tickets').select('*').eq('id',id).maybeSingle()),run(sb.from('support_messages').select('*').eq('ticket_id',id).order('created_at')),setting('support'),rpc('admin_list')]);
  if(!t)return`<a class="back" href="#/support">${I('left')}Support Inbox</a>`+empty('inbox','Ticket not found','');TK=t;const cust=await rpc('admin_customer',{p_id:t.user_id}).catch(()=>null),u=cust?.user;
  const tpl=(sup.templates||[]),ai=(await aiReady());
  return`<a class="back" href="#/support">${I('left')}Support Inbox</a><div class="ph"><div><h1>${esc(t.subject)}</h1><p>${esc(t.name||'')} ${esc(t.email||'')} · opened ${fdt(t.created_at)}</p></div>
   <div class="acts">${t.status==='resolved'?`<button class="btn" data-act="tk-status" data-s="open">Reopen</button>`:`<button class="btn pri" data-act="tk-status" data-s="resolved">${I('check')}Resolve</button>`}</div></div>
  <div class="grid g-side"><div class="stack"><section class="card"><header><h2>Conversation</h2>${ai?`<button class="btn sm" data-act="tk-sum" data-busy="Summarizing…">${I('spark')}Summarize</button>`:''}</header><div id="tk-sum"></div>
    <div class="thread">${msgs.map(m=>`<div class="msg${m.internal?' note-msg':m.from_admin?' me':''}">${m.internal?'<b>Internal note</b> (the customer can\'t see this)\n':''}${esc(m.body)}<small>${m.internal||m.from_admin?'Calora team':esc(t.name||'Customer')} · ${fdt(m.created_at)}</small></div>`).join('')}</div></section>
   <section class="card"><header><h2>Reply</h2><select data-input="tk-tpl" aria-label="Insert a reply template" style="width:auto"><option value="">Insert template…</option>${tpl.map((x,n)=>`<option value="${n}">${esc(x.name)}</option>`).join('')}</select></header>
    <div class="pad stack"><label class="vh" for="tk-text">Reply</label><textarea id="tk-text" rows="7" maxlength="5000" placeholder="Write your reply… The customer sees it in the Calora app."></textarea>
     ${ai?`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><select id="tk-tone" aria-label="Tone" style="width:auto">${opts({friendly:'Friendly',professional:'Professional',empathetic:'Empathetic',short:'Short',formal:'Formal'},(await setting('ai')).tone||'friendly')}</select>
      <input type="text" id="tk-note" placeholder="Optional instruction for the AI, e.g. offer to look into it" style="flex:1;min-width:180px"><button class="btn" data-act="tk-draft" data-busy="Drafting…">${I('spark')}Draft with AI</button><button class="btn" data-act="tk-tone" data-busy="Rewriting…">Adjust tone</button></div>
      <p class="help">AI only fills in the box. Nothing is sent until you click Send.</p>`:`<p class="help">AI drafting turns on after you add a free AI key (Settings → AI).</p>`}
     <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" data-act="tk-send" data-busy="Sending…">${I('check')}Send reply</button><button class="btn" data-act="tk-note-add" data-busy="Saving…">Add internal note</button><button class="btn ghost" data-act="tk-email">${I('mail')}Also email</button></div>
     <p class="help">“Also email” opens your mail app with this text, addressed to ${esc(t.email||'the customer')}.</p></div></section></div>
   <div class="stack"><section class="card"><header><h2>Ticket</h2></header><div class="pad stack">
    <label class="f">Status<select data-input="tk-set" data-k="status">${opts({open:'Open',pending:'Pending',resolved:'Resolved'},t.status)}</select></label>
    <label class="f">Priority<select data-input="tk-set" data-k="priority">${opts(PRIO,t.priority)}</select></label>
    <label class="f">Assigned to<select data-input="tk-set" data-k="assigned_to"><option value="">Nobody</option>${admins.map(a=>`<option value="${esc(a.email)}" ${t.assigned_to===a.email?'selected':''}>${esc(ADMIN_NAMES[a.email]||a.email)}</option>`).join('')}</select></label></div></section>
   ${card('Customer',u?`<div class="pad stack" style="gap:6px"><b>${esc(u.name||'No name')}</b><span class="help">${esc(u.email)}</span><span class="help">Joined ${fdate(u.created_at)} · ${num(u.days_logged)} days logged · last active ${ago(u.last_active)}</span>
     <a class="btn sm" href="#/customers/${u.id}" style="justify-self:start">View profile</a></div>${cust.tickets.length>1?`<div style="border-top:1px solid var(--line)">${cust.tickets.filter(x=>x.id!==t.id).map(x=>`<a class="list-row" href="#/support/${x.id}"><span class="grow"><b>${esc(x.subject)}</b><span>${fdate(x.created_at)}</span></span>${statusChip(x.status)}</a>`).join('')}</div>`:''}`:empty('users','Customer not found',''))}</div></div>`}
async function aiReady(){if(S.aiReady==null){try{S.aiStatus=await callFn('admin-ai',{action:'status'});S.aiReady=!!S.aiStatus.configured}catch(_){S.aiReady=false}}return S.aiReady}
INPUT['tk-tpl']=e=>{const t=(S.settings.support?.templates||[])[e.target.value];if(t){const ta=$('#tk-text'),sig=S.settings.support?.signature;ta.value=(ta.value?ta.value+'\n\n':'')+t.body+(sig&&!ta.value.includes(sig)?`\n\n${sig}`:'');ta.focus()}e.target.value=''};
INPUT['tk-set']=e=>{const k=e.target.dataset.k,v=e.target.value||null;busy(null,async()=>{await run(sb.from('support_tickets').update({[k]:v}).eq('id',TK.id));TK[k]=v;toast('Ticket updated');refreshCounts()})};
ACT['tk-status']=b=>busy(b,async()=>{await run(sb.from('support_tickets').update({status:b.dataset.s}).eq('id',TK.id));toast(b.dataset.s==='resolved'?'Resolved':'Reopened');refreshCounts();route()});
async function addMsg(b,internal){const body=$('#tk-text').value.trim();if(!body){$('#tk-text').focus();return toast('Write something first',1)}
  if(!internal&&!await confirmBox('Send this reply?',`${esc(TK.name||'The customer')} will see it in the Calora app.`,{ok:'Send reply'}))return;
  return busy(b,async()=>{await run(sb.from('support_messages').insert({ticket_id:TK.id,body,internal}));toast(internal?'Note added':'Reply sent');route()})}
ACT['tk-send']=b=>addMsg(b,false);ACT['tk-note-add']=b=>addMsg(b,true);
ACT['tk-email']=()=>{const body=$('#tk-text').value.trim();location.href=`mailto:${encodeURIComponent(TK.email||'')}?subject=${encodeURIComponent('Re: '+TK.subject)}&body=${encodeURIComponent(body)}`};
ACT['tk-draft']=b=>busy(b,async()=>{const ta=$('#tk-text');if(ta.value.trim()&&!await confirmBox('Replace your text?','The AI draft replaces what\'s in the reply box.',{ok:'Replace'}))return;
  const r=await callFn('admin-ai',{action:'draft',id:TK.id,tone:$('#tk-tone').value,note:$('#tk-note').value.trim()});ta.value=r.text;ta.focus();toast('Draft ready. Review it before sending.')});
ACT['tk-tone']=b=>busy(b,async()=>{const ta=$('#tk-text');if(!ta.value.trim())return toast('Write or draft a reply first',1);const r=await callFn('admin-ai',{action:'tone',text:ta.value,tone:$('#tk-tone').value});ta.value=r.text;toast('Tone adjusted')});
ACT['tk-sum']=b=>busy(b,async()=>{const r=await callFn('admin-ai',{action:'summarize',id:TK.id});$('#tk-sum').innerHTML=`<div class="pad" style="border-bottom:1px solid var(--line);white-space:pre-wrap"><b>AI summary</b>\n${esc(r.text)}</div>`});

const AL={page:0,admin:'',type:'',q:''};
PAGES.activity=async()=>{let qy=sb.from('admin_activity').select('*',{count:'exact'}).order('created_at',{ascending:false}).range(AL.page*50,AL.page*50+49);
  if(AL.admin)qy=qy.eq('admin_email',AL.admin);if(AL.type)qy=qy.eq('item_type',AL.type);if(AL.q)qy=qy.ilike('item_label',`%${AL.q.replace(/[%_]/g,'')}%`);
  const[{rows,count},admins]=await Promise.all([run(qy),rpc('admin_list')]);const pages=Math.max(1,Math.ceil(count/50));
  return`<div class="ph"><div><h1>Activity Log</h1><p>Every important admin action, recorded by the database. Entries can't be edited or deleted.</p></div></div>
  <section class="card"><form class="bar" data-form="al"><div class="grow search" style="max-width:none">${I('search')}<input type="search" name="q" value="${esc(AL.q)}" placeholder="Search item names" aria-label="Search activity"></div>
   <select name="admin" aria-label="Admin" style="width:auto"><option value="">Both admins</option>${admins.map(a=>`<option value="${esc(a.email)}" ${AL.admin===a.email?'selected':''}>${esc(a.email)}</option>`).join('')}</select>
   <select name="type" aria-label="Type" style="width:auto"><option value="">Everything</option>${opts({session:'Sign-ins',posts:'News',upcoming:'Coming soon',promo_codes:'Promo codes',plans:'Plans',ideas:'Ideas',support_tickets:'Tickets',support_messages:'Replies',customer:'Customers',admin_settings:'Settings'},AL.type)}</select><button class="btn">Filter</button></form>
   ${rows.length?`<div class="tw"><table><thead><tr><th>When</th><th>Admin</th><th>What happened</th><th class="hide-m">Item</th></tr></thead><tbody>${rows.map(a=>`<tr><td style="white-space:nowrap">${fdt(a.created_at)}</td><td>${esc(a.admin_email||'—')}</td><td>${actText(a)}</td><td class="hide-m">${actLink(a)?`<a href="${esc(actLink(a))}">Open</a>`:'—'}</td></tr>`).join('')}</tbody></table></div>
    <div class="pager"><span>${num(count)} entries</span><span style="display:flex;gap:6px"><button class="btn sm" data-act="al-page" data-d="-1" ${AL.page?'':'disabled'}>${I('left')}Newer</button><button class="btn sm" data-act="al-page" data-d="1" ${AL.page+1<pages?'':'disabled'}>Older${I('right')}</button></span></div>`
    :empty('list','No activity matches','')}</section>`};
FORM.al=f=>{AL.q=field(f,'q');AL.admin=f.admin.value;AL.type=f.type.value;AL.page=0;route()};

PAGES.settings=async tab=>{tab=STABS[tab]?tab:'access';const body=await({access:setAccess,app:setApp,notifications:setNotif,branding:setBrand,ai:setAI,support:setSupport,publishing:setPublishing,security:setSecurity})[tab]();

async function setAccess(){const a=await rpc('admin_list');

   <div class="note">${I('shield')}<span><b>Only these two accounts can open the admin panel.</b> The database checks this on every request, so changing the website can't get around it. Customers can never become admins.

async function setBrand(){const sw=(c,l)=>`<div style="display:flex;gap:10px;align-items:center"><span style="width:28px;height:28px;border-radius:6px;background:${c};border:1px solid var(--line)"></span><span><b>${l}</b><br><code>${c}</code></span></div>`;

   <div><b>Reply templates</b><div id="tpls" class="stack" style="margin-top:8px">${t.map(tplRow).join('')}</div><button type="button" class="btn sm" data-act="tpl-add" style="margin-top:8px">${I('plus')}Add template</button></div>
   <div class="note">${I('mail')}<span><b>How replies reach customers:</b> replies show up inside the customer's Calora app (Profile → Help & support). “Also email” opens your own mail app.
    Sending emails automatically from the panel needs an email provider (for example Resend) and a domain you own. Tell Claude when you have one and it can be connected.</span></div><div><button class="btn pri" data-busy="Saving…">Save</button></div></form>`}
const tplRow=(x={})=>`<div class="card pad stack tpl" style="background:var(--card2);gap:8px"><input type="text" name="tname" value="${esc(x.name||'')}" placeholder="Template name" maxlength="60" aria-label="Template name"><textarea name="tbody" rows="3" maxlength="2000" placeholder="Template text" aria-label="Template text">${esc(x.body||'')}</textarea><button type="button" class="btn sm ghost danger" data-act="tpl-del" style="justify-self:start">${I('trash')}Remove</button></div>`;
ACT['tpl-add']=()=>$('#tpls').insertAdjacentHTML('beforeend',tplRow());ACT['tpl-del']=b=>b.closest('.tpl').remove();
FORM['set-support']=(f,e)=>busy(e.submitter,async()=>{const templates=$$('.tpl',f).map(r=>({name:r.querySelector('[name=tname]').value.trim(),body:r.querySelector('[name=tbody]').value.trim()})).filter(x=>x.name&&x.body);
  await saveSetting('support',{signature:field(f,'signature'),templates});toast('Saved')});
async function setPublishing(){const v=await setting('publishing');
  return`<form class="card pad stack" data-form="set-pub" style="max-width:640px"><p class="help">Defaults for new news posts. You can change them on each post.</p>
   <label class="f">Default category<select name="category">${opts(CATS,v.category||'news')}</select></label><label class="f">Expire posts after (days) <small>Empty = never</small><input type="number" name="expiry_days" min="1" max="365" value="${v.expiry_days||''}"></label>
   <div class="note">${I('shield')}<span>Nothing is ever published automatically. Every post needs you to click Publish and confirm.</span></div><div><button class="btn pri" data-busy="Saving…">Save</button></div></form>`}
FORM['set-pub']=(f,e)=>busy(e.submitter,async()=>{const d=f.expiry_days.value?Math.min(365,Math.max(1,parseInt(f.expiry_days.value))):null;await saveSetting('publishing',{category:f.category.value,expiry_days:d});toast('Saved')});
async function setSecurity(){const{data}=await sb.auth.mfa.listFactors(),f=data?.totp?.find(x=>x.status==='verified');S.factor=f||null;
  return`<div class="stack" style="max-width:720px">${card('Two-factor authentication',`<div class="pad stack">${f?`<p>${chip('On','ok')} You enter a code from your authenticator app when you sign in to the admin panel.</p><div><button class="btn danger" data-act="mfa-off">Turn off two-factor</button></div>`
     :`<p class="help">Adds a 6-digit code from an authenticator app (Google Authenticator, 1Password, Authy…) every time you sign in. Strongly recommended for admin accounts.</p><div><button class="btn pri" data-act="mfa-on">${I('shield')}Turn on two-factor</button></div>`}</div>`)}
   ${card('Session',`<div class="pad stack"><p>Signed in as <b>${esc(S.user.email)}</b> with ${S.user.app_metadata?.provider==='google'?'Google':'email & password'} · last sign-in ${fdt(S.user.last_sign_in_at)}</p>
     <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="signout">${I('out')}Sign out</button><button class="btn danger" data-act="signout-all">Sign out on all devices</button></div>
     <p class="help">Signing out here also signs you out of the Calora app in this browser.</p></div>`)}</div>`}
ACT['mfa-on']=b=>busy(b,async()=>{const{data,error}=await sb.auth.mfa.enroll({factorType:'totp',friendlyName:'Calora admin '+new Date().toISOString().slice(0,10)});if(error)throw fail(error);
  modal({title:'Turn on two-factor',body:`<ol style="margin:0;padding-left:18px;display:grid;gap:8px"><li>Open your authenticator app and scan this code.</li><li>Enter the 6-digit code it shows.</li></ol>
   <img class="qr" src="${esc(data.totp.qr_code)}" alt="QR code for your authenticator app"><p class="help" style="text-align:center">Can't scan? Enter this key: <code>${esc(data.totp.secret)}</code></p>
   <form id="mfa-form" data-form="mfa-verify" data-factor="${esc(data.id)}"><label class="f">6-digit code<input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required autofocus></label><p class="err" id="form-err" role="alert"></p></form>`,
   actions:`<button class="btn" data-act="mfa-cancel" data-factor="${esc(data.id)}">Cancel</button><button class="btn pri" form="mfa-form" data-busy="Checking…">Turn on</button>`})});
FORM['mfa-verify']=(f,e)=>{const code=field(f,'code');if(!/^\d{6}$/.test(code))return fieldErr(f,'code','Enter the 6 digits from your app.');
  return busy(e.submitter||$('#modal .pri'),async()=>{const{error}=await sb.auth.mfa.challengeAndVerify({factorId:f.dataset.factor,code});if(error)return fieldErr(f,'code','That code didn\'t work. Check the time on your phone and try the newest code.');
    closeModal();toast('Two-factor is on');route()})};
ACT['mfa-cancel']=async b=>{await sb.auth.mfa.unenroll({factorId:b.dataset.factor}).catch(()=>{});closeModal()};
ACT['mfa-off']=async b=>{if(!await confirmBox('Turn off two-factor?','Your admin account will be protected by your password or Google sign-in only.',{ok:'Turn off',danger:1}))return;
  busy(b,async()=>{const{error}=await sb.auth.mfa.unenroll({factorId:S.factor.id});if(error)throw fail(error);await sb.auth.refreshSession();toast('Two-factor is off');route()})};

// ================= sign-in, routing, events =================
const TITLES={overview:'Overview',analytics:'Analytics & Growth',customers:'Customers',revenue:'Revenue & Plans',news:'News & Updates',upcoming:'Coming Soon / Deals',promos:'Promo Codes',ideas:'Idea Lab',support:'Support Inbox',activity:'Activity Log',settings:'Settings'};
let routeSeq=0,poll=null;
async function route(){if(!S.entered)return;const[name='overview',a,b]=location.hash.replace(/^#\/?/,'').split('/').map(decodeURIComponent);
  if(!PAGES[name]){location.replace('#/overview');return}setCurrent(name);closeMenu();closePop();
  const page=$('#page'),my=++routeSeq;page.innerHTML=skel(5);document.title=`${TITLES[name]} — Calora Admin`;
  try{const html=await PAGES[name](a,b);if(my!==routeSeq)return;page.innerHTML=html;MOUNT[name]?.(a,b)}
  catch(e){if(my!==routeSeq)return;console.error(e);page.innerHTML=`<section class="card">${empty('info','Couldn\'t load this page',esc(e.message||'Something went wrong.'),'<button class="btn" data-act="retry">Try again</button>')}</section>`}
  page.focus({preventScroll:true});scrollTo(0,0)}
ACT.retry=()=>route();

// ---------- screens before the panel ----------
function loginView(msg=''){S.entered=false;clearInterval(poll);document.documentElement.dataset.theme=lsGet('adm:theme')||'dark';document.title='Sign in — Calora Admin';
  $('#root').innerHTML=`<main class="login"><div class="card"><div style="display:flex;gap:12px;align-items:center">${LOGO(42)}<div><h1>Calora Admin</h1><p class="help">Private. Authorized accounts only.</p></div></div>
   ${msg?`<div class="note acc" role="alert">${I('info')}<span>${msg}</span></div>`:''}
   <button class="btn" data-act="google" style="min-height:44px"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.3-1.6 3.9-5.5 3.9-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.7 3.3 14.6 2.4 12 2.4 6.7 2.4 2.4 6.7 2.4 12s4.3 9.6 9.6 9.6c5.5 0 9.2-3.9 9.2-9.4 0-.6-.1-1.1-.2-1.6H12z"/></svg>Continue with Google</button>
   <div class="or">or</div><form data-form="login" class="stack" novalidate><label class="f">Email<input type="email" name="email" autocomplete="username" required></label>
    <label class="f">Password<input type="password" name="password" autocomplete="current-password" required></label><p class="err" id="form-err" role="alert"></p><button class="btn pri" data-busy="Signing in…">Sign in</button></form>
   <div style="display:flex;justify-content:space-between;gap:8px"><button class="btn ghost sm" data-act="forgot">Forgot password?</button><a class="btn ghost sm" href="./">← Back to Calora</a></div></div></main>`}
function deniedView(email,needs2fa){S.entered=false;$('#root').innerHTML=`<main class="login"><div class="card"><div style="display:flex;gap:12px;align-items:center">${LOGO(42)}<h1>No admin access</h1></div>
  <p><b>${esc(email)}</b> ${needs2fa?'needs to finish two-factor sign-in.':'isn\'t an admin account. Only the two Calora owners can open this page.'}</p>
  <button class="btn pri" data-act="signout">Use a different account</button><a class="btn ghost" href="./">← Back to Calora</a><p class="help">“Use a different account” also signs you out of the Calora app in this browser.</p></div></main>`}
async function mfaView(){S.entered=false;const{data}=await sb.auth.mfa.listFactors(),f=data?.totp?.find(x=>x.status==='verified');if(!f)return deniedView(S.user.email,true);
  $('#root').innerHTML=`<main class="login"><form class="card" data-form="mfa-login" data-factor="${esc(f.id)}"><div style="display:flex;gap:12px;align-items:center">${LOGO(42)}<div><h1>Two-factor code</h1><p class="help">${esc(S.user.email)}</p></div></div>
   <label class="f">6-digit code from your authenticator app<input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required autofocus></label>
   <p class="err" id="form-err" role="alert"></p><button class="btn pri" data-busy="Checking…">Continue</button><button type="button" class="btn ghost" data-act="signout">Cancel and sign out</button></form></main>`;$('#root input').focus()}
FORM['mfa-login']=(f,e)=>{const code=field(f,'code');if(!/^\d{6}$/.test(code))return fieldErr(f,'code','Enter the 6 digits from your app.');
  return busy(e.submitter,async()=>{const{data,error}=await sb.auth.mfa.challengeAndVerify({factorId:f.dataset.factor,code});if(error)return fieldErr(f,'code','That code didn\'t work. Try the newest one.');enter(data?.session||(await sb.auth.getSession()).data.session,true)})};
FORM.login=(f,e)=>{clearErr(f);const email=field(f,'email'),password=f.password.value;if(!email)return fieldErr(f,'email','Enter your email.');if(!password)return fieldErr(f,'password','Enter your password.');
  return busy(e.submitter,async()=>{const{error}=await sb.auth.signInWithPassword({email,password});
    if(error)return fieldErr(f,'password',/confirm/i.test(error.message)?'Confirm your email address first (check your inbox).':/invalid/i.test(error.message)?'Wrong email or password.':error.message)})};
ACT.google=b=>busy(b,async()=>{const{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(error)throw fail(error)});
ACT.forgot=()=>{modal({title:'Reset password',body:`<form id="fp" data-form="forgot" class="stack"><label class="f">Email<input type="email" name="email" required autofocus></label><p class="help">We'll email a link to set a new password in the Calora app.</p></form>`,
  actions:`<button class="btn" data-act="modal-close">Cancel</button><button class="btn pri" form="fp" data-busy="Sending…">Send link</button>`})};
FORM.forgot=(f,e)=>busy(e.submitter||$('#modal .pri'),async()=>{await sb.auth.resetPasswordForEmail(field(f,'email'),{redirectTo:location.origin+'/?flow=recovery'});closeModal();toast('If that email has an account, a reset link is on its way.')});

// ---------- entering the panel ----------
async function enter(session,afterMfa){if(!session)return loginView();S.user=session.user;
  const{data:aal}=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if(!afterMfa&&aal?.nextLevel==='aal2'&&aal.currentLevel!=='aal2'){const{data:adm}=await sb.rpc('is_admin');return adm===true?mfaView():deniedView(S.user.email)}
  const{data:ok,error}=await sb.rpc('admin_ok');if(error)return loginView('Couldn\'t check your access. Check your connection and refresh.');
  if(ok!==true)return deniedView(S.user.email);
  S.entered=true;const k='adm:logged:'+S.user.id;try{if(!sessionStorage.getItem(k)){await rpc('log_admin',{p_action:'signed_in',p_label:S.user.app_metadata?.provider||'email'});sessionStorage.setItem(k,'1')}}catch(_){}
  shell();route();clearInterval(poll);poll=setInterval(()=>{if(!document.hidden){refreshNotifs();refreshCounts()}},60000)}
async function onAuth(ev,session){if(ev==='TOKEN_REFRESHED'||ev==='USER_UPDATED'){if(session)S.user=session.user;return}
  if(!session){const was=S.entered;S.user=null;return loginView(ev==='SIGNED_OUT'&&was?'You\'re signed out.':'')}
  if(S.entered&&S.user?.id===session.user.id)return;enter(session)}
ACT.signout=async b=>{try{if(S.entered)await rpc('log_admin',{p_action:'signed_out'})}catch(_){}try{sessionStorage.removeItem('adm:logged:'+S.user?.id)}catch(_){}closeModal();await sb.auth.signOut();S.entered=false;loginView('You\'re signed out.')};
ACT['signout-all']=async b=>{if(!await confirmBox('Sign out everywhere?','You\'ll be signed out of the admin panel and the Calora app on every device.',{ok:'Sign out everywhere'}))return;
  try{await rpc('log_admin',{p_action:'signed_out',p_label:'all devices'})}catch(_){}await sb.auth.signOut({scope:'global'});S.entered=false;loginView('You\'re signed out on all devices.')};

// ---------- chrome actions ----------
ACT.collapse=()=>{S.collapsed=!S.collapsed;lsSet('adm:col',S.collapsed?'1':'0');$('#shell').classList.toggle('col',S.collapsed)};
ACT.menu=()=>{$('#shell').classList.add('open');if(!$('.scrim')){const s=document.createElement('div');s.className='scrim';s.onclick=closeMenu;$('#shell').append(s)}$('#side a')?.focus()};
function closeMenu(){$('#shell')?.classList.remove('open');$('.scrim')?.remove()}
ACT.theme=b=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;lsSet('adm:theme',t);b.innerHTML=I(t==='dark'?'sun':'moon');b.setAttribute('aria-label',`Switch to ${t==='dark'?'light':'dark'} mode`)};
function closePop(){const p=$('#pop');if(p&&!p.hidden){p.hidden=true;p.dataset.k=''}}
function openPop(k,html){const p=$('#pop');if(!p.hidden&&p.dataset.k===k)return closePop();p.innerHTML=html;p.dataset.k=k;p.hidden=false}
ACT.bell=async()=>{openPop('bell',bellHTML());refreshNotifs().then(()=>{if($('#pop').dataset.k==='bell')$('#pop').innerHTML=bellHTML()})};
ACT.me=()=>openPop('me',`<header>${esc(S.user.email)}</header><div class="list"><a class="n" href="#/settings/security">${I('shield')}Security & two-factor</a><a class="n" href="#/settings">${I('gear')}Settings</a><a class="n" href="./">${I('ext')}Open the Calora app</a><button class="n" data-act="signout" style="width:100%;text-align:left">${I('out')}Sign out</button></div>`);
ACT['read-all']=b=>busy(b,async()=>{await rpc('notif_read',{p_ids:null});await refreshNotifs();$('#pop').innerHTML=bellHTML()});
ACT['modal-close']=()=>closeModal();

document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');
  if(!e.target.closest('#pop,[data-act=bell],[data-act=me]'))closePop();if(!e.target.closest('.search')&&$('#gresults'))$('#gresults').hidden=true;
  if(a){if(a.tagName==='A')e.preventDefault();ACT[a.dataset.act]?.(a,e);return}
  const n=e.target.closest('[data-notif]');if(n){rpc('notif_read',{p_ids:[+n.dataset.notif]}).then(refreshNotifs).catch(()=>{});closePop();return}
  const tr=e.target.closest('tr[data-href]');if(tr&&!e.target.closest('a,button,input,select,label'))location.hash=tr.dataset.href});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();FORM[f.dataset.form]?.(f,e)});
document.addEventListener('change',e=>{const t=e.target.closest('[data-input]');if(t)INPUT[t.dataset.input]?.(e)});
document.addEventListener('keydown',e=>{if(e.key==='/'&&S.entered&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!$('#modal').open){e.preventDefault();$('#gsearch')?.focus()}
  if(e.key==='Escape'){closePop();closeMenu()}});
addEventListener('hashchange',route);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.entered){refreshNotifs();refreshCounts()}});

// ---------- start ----------
(async()=>{let lib;try{lib=await import(CFG.lib)}catch(_){$('#root').innerHTML=`<main class="login"><div class="card">${empty('info','Couldn\'t load the admin panel','Check your internet connection.','<button class="btn" onclick="location.reload()">Try again</button>')}</div></main>`;return}
  sb=lib.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce',storageKey:'calora-auth'}});
  sb.auth.onAuthStateChange((ev,session)=>setTimeout(()=>{if(/[?&]code=/.test(location.search))history.replaceState(null,'',location.pathname+location.hash);onAuth(ev,session)},0))})();

</script>
</body>
</html>
