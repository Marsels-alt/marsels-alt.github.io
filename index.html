<style>
/* VOICE: friendly and bubbly, native iOS with Liquid Glass. Glanceable, one-handed.
   IDEA: an iPhone app: content cards underneath, glass controls floating above them.
   PICTURE: the 3D tilting calorie card leads; macro cards flip over in 3D.
   COLOUR and TYPE: porcelain ground, cream Calora tile, cobalt accent, rose/amber/violet macros. SF Pro Rounded, system font fallback (no font downloads).
   LAYOUT: one 560px column; the glass tab bar floats at the bottom on phones and moves to the top on wide screens. */
:root{color-scheme:light dark;
--bg:light-dark(#F3F4FA,#06070B);--card:light-dark(#fff,#14151C);--chip:light-dark(#EEF0F7,#21232D);--trk:light-dark(#E8EAF2,#272934);
--ink:light-dark(#0E1020,#F4F5FA);--ink2:light-dark(#5B6073,#A3A7B9);--sep:light-dark(#ECEEF4,#23252F);
--acc:light-dark(#2B50F0,#6F8CFF);--acc2:light-dark(#6A86FF,#9AAEFF);--acc-bg:light-dark(#E6EBFF,#1B2350);
--bad:light-dark(#C40F2D,#FF7088);--bad-bg:light-dark(#FFEDF0,#3A0F19);
--pro:#FF3B6B;--carb:#FFAE1A;--fat:#9B5CFF;--fib:#1FB070;--wat:#18A9EE;
--sh:light-dark(rgb(30 40 110/.17),rgb(0 0 0/.65));--hi:light-dark(rgb(255 255 255/.95),rgb(255 255 255/.07));--edge:light-dark(rgb(14 16 32/.06),rgb(255 255 255/.07));
--glass:light-dark(rgb(255 255 255/.58),rgb(30 32 42/.55));
--a1:light-dark(#D9E1FF,#101B48);--a2:light-dark(#FFE2EA,#2C0E27);--a3:light-dark(#DFF5EC,#08241E);
--g1:light-dark(#4A68F5,#4A66F0);--g2:light-dark(#2B50F0,#2B49D8);--spring:cubic-bezier(.34,1.56,.64,1);--r:28px;--gap:14px;
--font:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
@supports (transition-timing-function:linear(0,1)){:root{--spring:linear(0,.009,.035 2.1%,.141,.281 6.7%,.723 12.9%,.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,.991,.977 51%,.974 53.8%,.975 57.1%,.997 69.8%,1.003 76.9%,1)}}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
:root[data-mode=light]{color-scheme:light}:root[data-mode=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);touch-action:manipulation}
body{margin:0;color:var(--ink);font:600 17px/1.4 var(--font);overflow-x:clip;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;background:radial-gradient(38% 28% at 12% 4%,var(--a1),transparent 70%),radial-gradient(34% 30% at 96% 34%,var(--a2),transparent 70%),radial-gradient(42% 30% at 24% 96%,var(--a3),transparent 70%),var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px;border-radius:12px}
svg.i{width:24px;height:24px;flex:none}
main{max-width:560px;margin:auto;padding:max(14px,env(safe-area-inset-top)) 18px calc(130px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;min-height:52px}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;letter-spacing:-.02em}
.date{color:var(--ink2);font-size:16px;margin:14px 2px 0}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:2px}
h1{font-size:40px;line-height:1.05;margin:6px 0 0;font-weight:900;letter-spacing:-.03em}
h2{font-size:22px;margin:32px 4px 14px;font-weight:900;letter-spacing:-.02em}
h3{font-size:19px;margin:0 0 4px;font-weight:800}
.lead{color:var(--ink2);margin:6px 2px 16px;font-size:16px}
.sub{color:var(--ink2);font-size:15px;font-weight:600}
.note{font-size:13px;color:var(--ink2);margin:10px 4px;font-weight:600}
.card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:inset 0 1px 0 var(--hi),0 0 0 1px var(--edge),0 18px 38px -22px var(--sh)}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(190%);-webkit-backdrop-filter:blur(22px) saturate(190%);box-shadow:inset 0 1px 0 var(--hi),inset 0 0 0 1px var(--edge),0 16px 40px -16px var(--sh)}
.bub{transition:transform .55s var(--spring)}
.bub:active{transform:scale(.92);transition-duration:.12s}
.tbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:9px 16px;font-size:16px;font-weight:800;white-space:nowrap}
.pill svg{width:20px;height:20px;color:var(--pro)}
/* week */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin:20px 0 22px}
.week button{display:grid;justify-items:center;align-content:center;gap:0;padding:6px 0;border-radius:18px;min-height:54px;font-size:12px;color:var(--ink2);background:var(--card);box-shadow:inset 0 1px 0 var(--hi),0 0 0 1px var(--edge)}
.week b{font-size:16px;color:var(--ink);font-weight:800}
.week .t{box-shadow:inset 0 0 0 2px var(--acc)}
.week .on{background:linear-gradient(160deg,var(--g1),var(--g2));color:#fff;box-shadow:inset 0 1px 0 rgb(255 255 255/.45),0 10px 20px -8px var(--acc)}.week .on b{color:#fff}
.week button:disabled{opacity:.4;cursor:default}
/* 3D hero */
.tilt{--rx:0deg;--ry:0deg;--gx:30%;--gy:0%;transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;transition:transform .7s var(--spring);position:relative}
.tilt::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(60% 70% at var(--gx) var(--gy),rgb(255 255 255/.5),transparent 60%);mix-blend-mode:soft-light}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:26px 22px;background:radial-gradient(120% 120% at 100% 0%,var(--acc-bg),var(--card) 62%);box-shadow:inset 0 1px 0 var(--hi),0 0 0 1px var(--edge),var(--sx,0px) calc(24px + var(--sy,0px)) 46px -20px var(--sh)}
.hero .z1{transform:translateZ(30px)}.hero .z2{transform:translateZ(55px)}
.big{font-size:clamp(54px,16vw,72px);font-weight:900;line-height:.95;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.hero .lbl{font-size:20px;font-weight:800;color:var(--ink2);margin-top:6px}
.rw{position:relative;display:grid;place-items:center}
.rw>svg{position:absolute;inset:0;transform:rotate(-90deg);overflow:visible}
.rw circle{fill:none;stroke-linecap:round}.trk{stroke:var(--trk)}
.arc{transition:stroke-dasharray 1.1s var(--spring);filter:drop-shadow(0 3px 6px color-mix(in srgb,var(--c) 45%,transparent))}
.rw .in{position:relative;font-weight:800;font-size:15px;display:grid;place-items:center}
.flame{width:44px;height:44px;color:var(--pro);filter:drop-shadow(0 6px 10px rgb(255 59 107/.35))}
/* macros flip */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap);margin-top:var(--gap)}
.flip{perspective:800px;text-align:start;display:block}
.flip .fi{display:grid;transform-style:preserve-3d;transition:transform .8s var(--spring)}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;margin-top:16px}.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}

<h1>Privacy Policy</h1>
<p class="sub">Last updated 23 November 2026</p>
<div class="card">
<h2>Who we are</h2>
<p>Calora is a calorie and macro tracker run by the Calora team in Latvia (European Union). We are responsible for your data (the "controller" under the GDPR). Questions? Email <a href="mailto:blatemarsels355@gmail.com">blatemarsels355@gmail.com</a>.</p>

<h2>What we collect</h2>
<ul>
<li><b>Your account:</b> your name and email address. If you choose "Continue with Google", Google shares your name and email address with us.</li>
<li><b>Health information you enter:</b> the food you log, small photos of meals you choose to save, water and weight entries, your goals and body details (sex, age, height and weight), your allergies, and your messages to the coach.</li>
<li><b>Your choices:</b> appearance and text size settings, and when you agreed to this policy.</li>
</ul>
<p>We don't use advertising, tracking analytics or marketing emails, and we never sell your data.</p>

<h2>Why we use it</h2>
<ul>
<li>To run Calora for you: your account, syncing your data between your devices, and the app's features. This is needed to provide the service you asked for.</li>
<li>Your health information, only with your explicit consent, which you give before you start using Calora. You can withdraw it at any time with <b>Delete account</b> in Profile (or, without an account, <b>Delete all data on this device</b>).</li>
<li>To keep Calora safe, for example blocking accounts that abuse it.</li>
</ul>

<h2>How Calora uses AI</h2>
<ul>
<li><b>Photo recognition:</b> an AI model (CLIP, made by OpenAI) runs on your own device and suggests what food is in your photo. The photo isn't sent to us or anyone else to be analysed.</li>
<li><b>Typed meals and the coach:</b> Calora's built-in AI matches what you type against its food list, and the built-in coach answers from your goals and logs. Both run on your device.</li>
<li><b>Inside the Claude app:</b> if you open Calora inside Anthropic's Claude app, the photos, meal descriptions and coach messages you send are processed by Anthropic's Claude AI to answer you, under Anthropic's privacy policy.</li>
</ul>
<p>AI results are estimates and can be wrong. Always check them.</p>

<h2>Photos</h2>
<p>When you log a scanned meal, a small thumbnail is saved with that day's log: on your device and, if you have an account, in your private account. We don't use public file storage. Deleting the food, erasing your data or deleting your account removes the thumbnail.</p>

<h2>Where your data is stored</h2>
<p>With an account, your data is stored by Supabase in a data centre in the European Union. Row-level security means only you can read or change your data. Without an account, your data stays only in your browser on that device.</p>

<h2>Who else handles your data</h2>
<ul>
<li><b>Supabase Inc.</b>: database, sign-in and account emails (confirming your email, resetting your password).</li>
<li><b>Google LLC</b>: only if you choose "Continue with Google".</li>
<li><b>GitHub Inc.</b>: hosts this website (GitHub Pages).</li>
<li><b>jsDelivr</b> and <b>Hugging Face</b>: deliver the app's code libraries and, when you download it, the built-in AI model.</li>
</ul>
<p>Like any website, these services can see your IP address and basic browser details when your browser connects to them. Some are US companies. Where data leaves the EU, it's protected by the safeguards the GDPR requires, such as the EU's Standard Contractual Clauses.</p>
<p>The Calora team can see a list of accounts (name, email address, sign-in method, sign-up date and last sign-in) to run and protect the service. We don't look at your food logs, weight or other health information.</p>

<h2>Cookies and storage on your device</h2>
<p>Calora doesn't use cookies. It uses your browser's local storage to keep you signed in, save your data on the device, let you keep using your account offline, and keep the built-in AI model after you download it. These are all strictly necessary for features you ask for, so no cookie banner is needed. There's no advertising or analytics storage.</p>

<h2>How long we keep it</h2>
<p>Until you delete it. Deleting food, erasing your data or deleting your account removes it from our database straight away. Supabase may keep copies in its backups for a short time before they're overwritten.</p>

<h2>Your rights</h2>
<ul>
<li>See, correct or download your data, or ask us to delete it. Most of this you can do yourself in Profile; for anything else, email us and we'll reply within one month.</li>
<li><b>Delete account</b> at the bottom of Profile permanently deletes your account and all its data. Without an account, <b>Delete all data on this device</b> does the same on that device.</li>
<li>Withdraw your consent, or object to how we use your data, at any time.</li>
<li>Complain to Latvia's data protection authority, the Data State Inspectorate (<a href="https://www.dvi.gov.lv/en">dvi.gov.lv</a>), or to the authority in your own EU country.</li>
</ul>

<h2>Emails</h2>
<p>We only send emails you need for your account, such as confirming your email address or resetting your password. We don't send marketing emails, so there's nothing to unsubscribe from.</p>

<h2>Children</h2>
<p>Calora is for people aged 13 and older. If you're under 18, please use Calora together with a parent or guardian. If we learn that someone under 13 has an account, we'll delete it.</p>

<h2>Changes</h2>
<p>If this policy changes, we'll update this page and the date at the top, and tell you in the app if the change is important.</p>
</div>

<p>You must be 13 or older. If you're under 18, use Calora together with a parent or guardian, and talk to a doctor before trying to lose weight. For under-18s and anyone underweight, Calora sets goals to keep your weight steady instead of losing weight.</p>

<h2>Not medical advice</h2>
<ul>

<h2>Liability</h2>
<p>To the extent the law allows, the Calora team isn't liable for indirect losses, or for decisions you make based on Calora's estimates. Nothing in these terms limits liability that can't legally be limited, or your rights as a consumer.</p>

<h2>Law</h2>

function authMsg(e){if(!e)return'';if(e.code&&AUTH_MSG[e.code])return AUTH_MSG[e.code];

async function initAuth(){if(!SB_ON){authReady=true;render();return maybeOnboard()}

  sb=createClient(CALORA_CONFIG.supabaseUrl,CALORA_CONFIG.supabaseKey,{auth:{flowType:'pkce',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'calora-auth'}});
  const q=new URLSearchParams(location.search);
  const {error}=await sb.auth.getSession(); // also finishes sign-in from email and Apple links (?code=)
  if(error)A.err=authMsg(error);else if(q.get('error_description'))A.err=q.get('error_description');
  if(q.get('flow')==='recovery'&&!error)A.view='reset';
  const th=q.get('token_hash'),ty=q.get('type');
  if(th&&ty){const r=await sb.auth.verifyOtp({token_hash:th,type:ty});if(r.error)A.err=authMsg(r.error);else if(ty==='recovery')A.view='reset';else A.info='Your email is confirmed. Welcome to Calora!'}
  if([...q.keys()].length)history.replaceState(null,'',location.pathname+location.hash);
  sb.auth.onAuthStateChange((ev,session)=>setTimeout(()=>onAuth(ev,session),0)); // fires INITIAL_SESSION right away

 }catch(e){ // library couldn't load (offline): keep the last account usable on this device; it syncs next time
  let last=null;try{last=JSON.parse(localStorage.getItem('calora:last'))}catch(_){}
  if(last){USER=last;S=loadState('calora:u:'+last.id);sync='offline'}else A.err="Can't connect to Calora's servers. Check your internet connection, or continue without an account.";

// download this user's data; keep local edits that haven't uploaded yet
async function pull(first){if(!sb||!USER||USER.offline)return;const uid=USER.id;lastPull=Date.now();setSync('syncing');
 const [p,d]=await Promise.all([sb.from('profiles').select('settings,weights,chat').eq('id',uid).maybeSingle(),sb.from('day_logs').select('day,items,water').eq('user_id',uid)]);
 if(!USER||USER.id!==uid)return;if(p.error||d.error){setSync('offline');return}
 const SY=S._sync||(S._sync={d:{},p:''});
 if(!p.data){ // brand-new account: bring this device's guest logs along, once
  const g=loadState('calora');if(first&&!S._migrated&&Object.keys(g.days).length){for(const k of['days','weights','goals','profile','allergies','other','onboarded','start','consent'])S[k]=g[k];S._migrated=true;toast('Your logs on this device are now saved to your account.')}
  save();await push();return}

 const remote=new Set();
 for(const r of d.data){remote.add(r.day);const loc=S.days[r.day];if(loc&&SY.d[r.day]!==JSON.stringify(loc))continue;S.days[r.day]={items:r.items||[],water:r.water||0};SY.d[r.day]=JSON.stringify(S.days[r.day])}
 for(const k of Object.keys(S.days))if(!remote.has(k)&&SY.d[k]===JSON.stringify(S.days[k])){delete S.days[k];delete SY.d[k]} // deleted on another device
 if(!localProfileChanged)SY.p=JSON.stringify(profPayload());
 try{localStorage.setItem(curKey(),JSON.stringify(S))}catch(_){}render();await push()}

// upload what changed since the last successful sync
async function push(){if(!sb||!USER||USER.offline)return false;if(pushing){schedulePush();return false}pushing=true;const uid=USER.id,SY=S._sync||(S._sync={d:{},p:''});let ok=true;
 try{if(S._wipe){const {error}=await sb.from('day_logs').delete().eq('user_id',uid);if(error)ok=false;else{S._wipe=false;SY.d={}}}
  const rows=Object.entries(S.days).map(([k,v])=>[k,JSON.stringify(v)]).filter(([k,j])=>SY.d[k]!==j);
  if(ok&&rows.length){setSync('syncing');const {error}=await sb.from('day_logs').upsert(rows.map(([k])=>({user_id:uid,day:k,items:S.days[k].items||[],water:Math.round(S.days[k].water||0)})));if(error)ok=false;else rows.forEach(([k,j])=>SY.d[k]=j)}
  const pj=JSON.stringify(profPayload());if(ok&&SY.p!==pj){setSync('syncing');const {error}=await sb.from('profiles').upsert({id:uid,...JSON.parse(pj)});if(error)ok=false;else SY.p=pj}
 }catch(e){ok=false}

async function estimate(){SH.busy=true;SH.err='';SH.items=null;SH.alts=null;SH.prog=null;renderSheet();
 const img=SH.mode==='scan'&&SH.blob,al=allergyNames();let asked=false;
 if(AI&&(!img||AIimg||SH.text.trim())){const prompt=`You estimate nutrition for a calorie-tracking app.${img&&AIimg?' Identify every food and drink in the attached photo and estimate the portion sizes you can see.':''}${SH.text.trim()?` The user describes the meal as: «${SH.text.slice(0,600)}»`:''}
Assume typical recipes and include hidden ingredients such as butter, oil, sauces, dressings, breading and stock.
The user's food allergies: ${al.length?al.join(', '):'none listed'}.
Reply with JSON only, in exactly this shape:
{"items":[{"name":"short name with portion, e.g. 2 scrambled eggs","kcal":0,"protein":0,"carbs":0,"fat":0,"fiber":0,"ingredients":["likely ingredients"],"allergens":["allergens likely present"]}]}
For "allergens", use these words where they apply: peanuts, tree nuts, dairy, eggs, gluten, fish, shellfish, soy, sesame. Also add any of the user's own allergy words that are likely present. Macros are grams. If there is no food, reply {"items":[]}.`;
  try{const v=await askJSON(prompt,img&&AIimg?[SH.blob]:null);asked=true;SH.items=(v.items||[]).slice(0,12).map(fromAI);if(!SH.items.length){SH.items=null;SH.err=img?"Couldn't spot any food. Try another photo, or describe it.":"Couldn't work out any food from that. Try adding more detail."}}catch(e){}}
 if(!SH.items&&img&&!asked){try{const res=await deviceScan(SH.blob,p=>{SH.prog=p;const el=$('#busytxt');if(el)el.textContent=`Downloading built-in AI, one time only… ${r(p*100)}%`});
   if(!S.devReady){S.devReady=true;save()}SH.items=[mk(res[0].f)];SH.alts=res.slice(1).map(x=>FOODS.indexOf(x.f))}
  catch(e){SH.err="The built-in AI couldn't load here. It needs internet the first time. Describe your meal instead."}}
 if(!SH.items&&SH.text.trim()){SH.items=localParse(SH.text);SH.err=''}
 SH.busy=false;renderSheet()}
function addItems(items){if(!items.length)return;const L=day(sel).items;L.push(...items);save();closeSheet();render();toast(`Added ${items.length>1?items.length+' items':items[0].name}`,()=>{L.splice(L.length-items.length,items.length);save();render()})}
$('#file').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const im=new Image();im.onload=()=>{const cv=(z,sq)=>{const c=document.createElement('canvas'),s=Math.min(im.width,im.height),k=Math.min(1,z/Math.max(im.width,im.height));if(sq){c.width=c.height=z;c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,z,z)}else{c.width=r(im.width*k);c.height=r(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height)}return c};
 SH.photo=cv(320,1).toDataURL('image/jpeg',.82);cv(1024).toBlob(b=>{SH.blob=b;URL.revokeObjectURL(im.src);SH.items=null;SH.err='';if(!$('#sheet').open)openSheet('log');estimate()},'image/jpeg',.85)};im.src=URL.createObjectURL(f)};

// ---------- coach ----------
const ACT={sedentary:1.2,light:1.375,moderate:1.55,very:1.725,athlete:1.9};
const noCut=p=>p.age<18||p.weight/(p.height/100)**2<18.5; // teens and underweight people keep their weight steady
function calcGoals(p){const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==='male'?5:-161);let kcal=bmr*ACT[p.activity]+(p.goal==='lose'?(noCut(p)?0:-500):p.goal==='build'?300:0);kcal=r(Math.max(kcal,p.sex==='male'?1500:1200)/10)*10;
 const pr=r(p.weight*(p.goal==='build'?2:p.goal==='lose'?1.8:1.6)),f=r(kcal*.27/9);return{kcal,p:pr,c:Math.max(0,r((kcal-pr*4-f*9)/4)),f,fib:r(kcal/1000*14),water:r(p.weight*35/100)*100}}
const goalLine=g=>`**${fmt(g.kcal)} kcal** a day: ${g.p}g protein, ${g.c}g carbs, ${g.f}g fat, ${g.fib}g fiber and ${+(g.water/1000).toFixed(1)}L water.`;
// Calora's built-in coach: works on this device without Claude
function localCoach(t){const s=t.toLowerCase(),p=S.profile,g=S.goals,su=sum(T),kl=g.kcal-su.kcal,pl=g.p-su.p;
 const num=re=>{const m=s.match(re);return m?parseFloat(m[1].replace(',','.')):null};
 const h=num(/(\d{3})\s*cm/),w=num(/(\d{2,3}(?:[.,]\d)?)\s*kg/),a=num(/(\d{2})\s*(?:y\/?o\b|years?|yrs?)/);
 const goal=/lose|cut\b|drop|slim|fat loss/.test(s)?'lose':/muscle|bulk|gain|bigger|stronger/.test(s)?'build':/maintain|keep my weight/.test(s)?'maintain':null;
 const ideas=(n,lim)=>FOODS.filter(f=>f.k*f.d>40&&f.k*f.d<=lim&&!flags(mk(f)).length).sort((x,y)=>y.p/y.k-x.p/x.k).slice(0,12).sort(()=>Math.random()-.5).slice(0,n).map(f=>`- ${qn(f)}: **${r(f.p*f.d)}g protein**, ${r(f.k*f.d)} kcal`).join('\n');
 const hasAl=S.allergies.length||others().length;
 if(h&&w&&a){Object.assign(p,{height:h,weight:w,age:a});if(/female|woman|\bgirl|\bshe\b/.test(s))p.sex='female';else if(/\bmale\b|\bman\b|\bguy\b|\bhe\b/.test(s))p.sex='male';if(goal)p.goal=goal;
  const lose=num(/lose\s*(\d+(?:[.,]\d)?)\s*kg/),gain=num(/gain\s*(\d+(?:[.,]\d)?)\s*kg/),tooLow=lose&&(w-lose)/(h/100)**2<18.5;if(lose&&!tooLow)p.target=+(w-lose).toFixed(1);else if(gain)p.target=+(w+gain).toFixed(1);
  const steady=p.goal==='lose'&&(noCut(p)||tooLow);if(steady)p.goal='maintain';S.goals=calcGoals(p);save();const d=+Math.abs(p.weight-p.target).toFixed(1),wk=p.goal==='lose'&&d?Math.ceil(d*7700/500/7):p.goal==='build'&&d?Math.ceil(d/.25):0;
  if(steady)return`I've set your daily goals to ${goalLine(S.goals)}\n\n${p.age<18?"Because you're under 18, I've set them to keep your weight steady while you grow, not to lose weight.":tooLow?`Losing ${lose} kg would take you below a healthy weight, so I've set your goals to keep your weight steady instead.`:"Your weight is already below the healthy range, so I've set your goals to keep it steady, not to lose more."} Please talk to a doctor before trying to lose weight.`;
  return`Here's your plan. I've set your daily goals to ${goalLine(S.goals)}\n\n${p.goal==='lose'?`- A 500 kcal daily deficit loses about **0.5 kg a week**${wk?`, so ${d} kg takes roughly **${wk} weeks**`:''}.`:p.goal==='build'?`- A 300 kcal surplus with plenty of protein builds about 0.25 kg of muscle a week${wk?`, so roughly **${wk} weeks** for ${d} kg`:''}.`:'- This keeps your weight steady.'}\n- Spread protein over 3–4 meals, about **${r(S.goals.p/4)}g each**.\n- Log everything for two weeks, then check Progress.`}
 const food=findFoods(s,1).fs[0];
 if(food&&/calor|kcal|how many|macro|protein in|carbs in|fat in|healthy|how much/.test(s)){const fl=flags(mk(food));return`**${cap(food.n)}**: about **${food.k} kcal** per ${food.d>1?'piece':'serving'} (${food.g} g), with ${food.p}g protein, ${food.c}g carbs and ${food.f}g fat.${fl.length?`\n\nHeads up: it may contain **${fl.join(', ')}**, which you're allergic to.`:''}`}
 if(/eat|food|meal|snack|dinner|lunch|breakfast|hungry|rest of|suggest|recommend|idea/.test(s)){
  if(goal==='build')return`To build muscle, aim for **${r(p.weight*1.6)}–${r(p.weight*2.2)}g protein a day** (1.6–2.2 g per kg of body weight) and eat slightly above maintenance. Protein-rich picks${hasAl?' that avoid your allergies':''}:\n\n${ideas(4,900)}\n\nAdd rice, potatoes or oats around your training.`;
  if(kl<=50)return`You've reached your calories for today. If you're still hungry, go for something light and filling, like vegetables, berries or miso soup.`;
  return`You have **${fmt(kl)} kcal** and **${fmt(Math.max(pl,0))}g protein** left today. Options that fit${hasAl?' and avoid your allergies':''}:\n\n${ideas(3,kl)}`}
 if(goal){p.goal=goal;S.goals=calcGoals(p);save();return`Done. Your goal is now **${({lose:'lose weight',build:'build muscle',maintain:'maintain'})[goal]}**, based on your Profile (${p.height} cm, ${p.weight} kg, ${p.age} years): ${goalLine(S.goals)}\n\nIf those numbers aren't right, tell me your height, weight and age.`}
 if(/protein/.test(s))return pl>0?`You need **${fmt(pl)}g more protein** today. Easy wins${hasAl?' that avoid your allergies':''}:\n\n${ideas(3,Math.max(kl,300))}`:`You've hit your protein goal today: **${fmt(su.p)}g** of ${g.p}g. Nice work.`;
 if(/water|drink|hydrat|thirst/.test(s)){const left=Math.max(0,g.water-dayR(T).water);return left?`You've had **${+(dayR(T).water/1000).toFixed(2)} L** of ${g.water/1000} L today. About **${Math.ceil(left/250)} more glasses** to go. Tap + on the Water card each time.`:`You've hit your water goal today. 💧`}
 if(/progress|week|how am i|doing|streak|on track/.test(s)){const ss=[...Array(7)].map((_,i)=>sum(add(T,i-6))).filter(x=>x.kcal),av=ss.length?ss.reduce((q,x)=>q+x.kcal,0)/ss.length:0;
  return ss.length?`In the last 7 days you logged **${ss.length} days**, averaging **${fmt(av)} kcal** against your ${fmt(g.kcal)} goal. ${Math.abs(av-g.kcal)<=g.kcal*.1?'Right on track.':av>g.kcal?'A little over on average: trim a snack or add a walk.':'Under on average: eat enough to keep your energy up.'} Current streak: **${streak()} days**.`:`Log a few meals and I'll tell you how your week is going.`}
 if(/allerg|intoleran/.test(s)){const al=allergyNames();return al.length?`I'm watching for **${al.join(', ')}**. If a scanned or logged food may contain them, you'll see a red "Don't eat this" warning. You can change them in Profile → Allergies.`:`You haven't added any allergies yet. Add them in Profile → Allergies and I'll warn you whenever a food may contain them.`}
 if(/^\s*(hi|hey|hello|hiya|yo|good (morning|afternoon|evening))\b/.test(s))return`Hi${USER&&USER.name?' '+USER.name.split(' ')[0]:''}! You have **${fmt(Math.max(kl,0))} kcal** left today. Ask me what to eat, or tell me your height, weight, age and goal for a plan.`;
 if(/thank/.test(s))return`You're welcome! I'm here whenever you need me.`;
 return`I can help with:\n\n- **A plan**: tell me your height, weight, age and goal\n- **What to eat** for the rest of today\n- **Calories in a food**, like "calories in a burger"\n- **Your week**: "how am I doing?"`}
// self-harm or disordered-eating messages always get a caring reply with real help, never diet tips
const CRISIS=/suicid|kill(ing)? my ?self|end (it all|my life)|want(ed)? to die|don'?t want to (live|be alive|exist)|self[- ]?harm|hurt(ing)? my ?self|cut(ting)? my ?self|no reason to live|better off dead/i;
const EDRE=/starv(e|ing) my ?self|stop(ped)? eating (completely|altogether|for (a |\d+ )?days?)|not eat(ing)? (anything|at all|for (a |\d+ )?days?)|eat(ing)? nothing|skip(ping)? (all|every) meals?|purg(e|ing)|throw(ing)? up after|make my ?self (sick|throw up|vomit)|laxatives?|diet pills?|anorexi|bulimi|binge[- ]?(eat|and purge)|hate my body|\b(eat|eating|diet of|have) (only |just )?[1-9]\d\d (kcal|cal|calories) (a|per) day|\b[1-9]\d\d[- ]calorie diet/i;
const HELP=`- **In danger right now?** Call **112**.\n- **Latvia:** call **116 123** for emotional support, free and 24/7. Under 18: **116 111**.\n- **Anywhere else:** findahelpline.com lists free helplines in your country.`;
const careReply=t=>CRISIS.test(t)?`I'm really sorry you're feeling this way. You deserve support right now, and you don't have to go through it alone.\n\n${HELP}\n\nIf you can, tell someone you trust how you feel. I'm only a nutrition coach, but I'm glad you told me.`
 :EDRE.test(t)?`It sounds like food might feel really hard right now. I can't help with eating very little or making up for meals, because that can seriously hurt your body.\n\nTalking to someone can help: a doctor, or someone you trust.\n\n${HELP}\n\nYou deserve to eat enough and feel OK. 💙`:null;
async function sendMsg(text){text=text.trim();if(!text||coachBusy)return;S.chat.push({role:'user',content:text},{role:'assistant',content:''});coachBusy=true;render();

 if(cr){await new Promise(r=>setTimeout(r,400));last.content=cr;coachBusy=false;save();render();return}
 if(!AI){await new Promise(r=>setTimeout(r,600));last.content=localCoach(text);coachBusy=false;save();render();return}
 const su=sum(T),p=S.profile,ctx=`[Context from the Calora app, not typed by the user]
You are Calora's friendly nutrition coach inside a calorie and macro tracker. Reply in under 140 words: warm, concrete, short paragraphs or "- " bullet lists, **bold** for key numbers. No medical diagnosis; suggest a doctor or dietitian for medical conditions. If the user mentions self-harm, suicide or disordered eating, give no diet advice: respond with care and point them to 112, 116 123 (Latvia, 24/7), 116 111 (under 18) or findahelpline.com. Never set goals below 1200 kcal, and never plan weight loss for under-18s or anyone with a BMI under 18.5.

Eaten today: ${r(su.kcal)} kcal, protein ${r(su.p)} g, carbs ${r(su.c)} g, fat ${r(su.f)} g. Foods: ${dayR(T).items.map(i=>i.name).join('; ')||'nothing yet'}.
Allergies: ${allergyNames().join(', ')||'none'}. Never suggest foods containing these.
When the user gives height, weight, age and goal, work out sensible daily targets and call set_daily_goals, then tell them what you set.
[User message]
`;
 const msgs=S.chat.slice(0,-1).slice(-16).map((m,i,a)=>({role:m.role,content:i===a.length-1?ctx+m.content:m.content}));
 const tools=[{name:'set_daily_goals',description:"Save the user's daily nutrition goals in the app.",inputSchema:{type:'object',properties:{kcal:{type:'number'},protein_g:{type:'number'},carbs_g:{type:'number'},fat_g:{type:'number'},fiber_g:{type:'number'},water_ml:{type:'number'}},required:['kcal','protein_g','carbs_g','fat_g']},
  execute(x){const n=(v,d,lo,hi)=>Math.min(hi,Math.max(lo,r(+v||d)));S.goals={kcal:n(x.kcal,2000,1200,6000),p:n(x.protein_g,140,20,400),c:n(x.carbs_g,210,0,800),f:n(x.fat_g,65,10,300),fib:n(x.fiber_g,28,5,80),water:n(x.water_ml,2500,1000,6000)};save();return{saved:true}}}];
 try{const res=await AI(msgs,{tools,cache:false,onText:({text})=>{last.content=text;const el=$('#live');if(el&&text&&text!=='Thinking...')el.innerHTML=md(text)}});last.content=res.text||'…'}
 catch(e){last.content=e?.code==='rate_limited'?"I'm getting a lot of questions right now. Try again in a minute.":(e?.code==='not_granted'?(AI=null,localCoach(text)):"Sorry, I couldn't answer that just now. Please try again.")}

  if(was<gw&&x.water>=gw)toast('Water goal reached. Nice work!');return}
 if(d.log){SH={mode:d.log,photo:null,blob:null,text:'',items:null,busy:false,err:''};openSheet('log');if(d.log==='scan')$('#file').click();return}
 if(d.mode){if(SH.busy)return;SH.mode=d.mode;SH.items=SH.mode==='describe'&&!AI&&SH.text.trim()?localParse(SH.text):SH.mode==='scan'&&SH.photo?SH.items:null;SH.err='';return renderSheet()}
 if(d.q){const it=SH.items[+d.n];setQ(it,it.q+ +d.q*(it.st||.5));$('#res').innerHTML=resHTML();return}
 if(d.alt){SH.items[0]=mk(FOODS[+d.alt]);$('#res').innerHTML=resHTML();return}
 if(d.auth)return authAction(d.auth);
 if(d.adm)return admAction(d.adm,b);
 if(d.ban)return banUser(d.ban,b);
 if(d.udel){ADM.del=d.udel;SHD.busy=false;SHD.err='';return openSheet('admdel')}
 if(d.size){S.size=d.size;save();return render()}
 if(d.rm){SH.items.splice(+d.rm,1);$('#res').innerHTML=resHTML();return}
 if(d.del){const L=day(sel).items,i=L.findIndex(x=>x.id===d.del),[it]=L.splice(i,1);save();render();return toast(`Deleted ${it.name}`,()=>{L.splice(i,0,it);save();render()})}
 if(d.say)return sendMsg(d.say);
 if(d.cal){calSel=d.cal;return render()}
 if(d.open){sel=d.open;return go('today')}
 if(d.m){const f=D(calM+'-01');f.setMonth(f.getMonth()+ +d.m);calM=K(f).slice(0,7);return render()}
 if(d.pf){S.profile[d.pf]=d.v;save();return render()}
 if(d.alg){const a=S.allergies,i=a.indexOf(d.alg);i<0?a.push(d.alg):a.splice(i,1);save();b.setAttribute('aria-pressed',i<0);if(sheetKind==='welcome'&&$('#sheet').open){const w=$('[data-act=welcomed]');if(w)w.textContent=S.allergies.length||S.other.trim()?'Continue':'No allergies — continue'}return}
 if(d.themeset){S.theme=d.themeset;save();return render()}
 if('close' in d)return closeSheet();
 switch(d.act){
 case'theme':S.theme=isDark()?'light':'dark';save();render();break;
 case'estimate':estimate();break;
 case'addres':addItems((SH.items||[]).filter(i=>!i.miss).map((i,n)=>{const o={...i,name:i.q&&i.q!==1?`${i.q} × ${i.name}`:i.name};delete o.b;delete o.st;if(!n&&SH.mode==='scan'&&SH.photo)o.img=SH.photo;return o}));break;
 case'dl':{b.disabled=true;b.textContent='Starting download…';devProg=p=>{const x=$('#dl');if(x)x.textContent=`Downloading… ${r(p*100)}%`};loadDevice().then(()=>{S.devReady=true;save();render();toast('Built-in AI is ready')}).catch(()=>{const x=$('#dl');if(x){x.disabled=false;x.textContent='Download built-in AI now'}toast("Couldn't download. Check your internet connection.")});break}
 case'addmanual':{const v=k=>+$('#m-'+k).value||0,name=$('#m-name').value.trim();if(!name&&!v('kcal')){$('#m-name').focus();break}
  addItems([{id:uid(),name:name||'Food',kcal:v('kcal'),p:v('p'),c:v('c'),f:v('f'),fib:v('fib'),ingredients:$('#m-ing').value.split(',').map(s=>s.trim()).filter(Boolean)}]);break}
 case'welcomed':S.onboarded=true;save();closeSheet();render();break;
 case'home':openSheet('home');break;
 case'install':installEvt?.prompt();installEvt=null;closeSheet();break;
 case'clearchat':S.chat=[];save();render();break;
 case'logw':{const v=+$('#wt').value;if(v<20||v>400){$('#wt').focus();break}S.weights[T]=+v.toFixed(1);S.profile.weight=+v.toFixed(1);save();render();toast(`Logged ${v} kg`);break}
 case'calc':S.goals=calcGoals(S.profile);save();render();toast(S.profile.goal==='lose'&&noCut(S.profile)?`Set to keep your weight steady (${fmt(S.goals.kcal)} kcal). Talk to a doctor before losing weight.`:`Goals set: ${fmt(S.goals.kcal)} kcal a day`);break;
 case'savegoals':{const g={};for(const k of['kcal','p','c','f','fib','water']){const v=+$('#g-'+k).value;g[k]=v>0?v:S.goals[k]}const low=g.kcal<1200;if(low)g.kcal=1200;S.goals=g;save();render();toast(low?'Saved. For safety, the lowest daily goal is 1,200 kcal. Talk to a doctor about anything lower.':'Goals saved');break}
 case'wipe':if(!wipe){wipe=1;render();break}try{for(const k of['calora','morsel-v2','calora:ann'])localStorage.removeItem(k)}catch(_){}S=loadState('calora');wipe=0;tab='today';history.replaceState(null,'','#today');render();syncNav();toast('All data on this device was deleted.');break;
 case'annx':try{localStorage.setItem('calora:ann',String(ANN.id))}catch(_){}render();break;
 case'pick':$('#file').click();break;
 case'erase':if(!erase){erase=1;render();break}S.days={};S.weights={};S.chat=[];erase=0;if(USER)S._wipe=true;save();render();toast('All logged food erased');break}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='usearch'){ADM.q=t.value;$('#ulist').innerHTML=userRows();return}if(t.dataset.af){A.f[t.dataset.af]=t.value;t.removeAttribute('aria-invalid')}
 if(t.dataset.pn){const v=+t.value;if(v>0){S.profile[t.dataset.pn]=v;save()}}
 if(t.id==='other'){S.other=t.value;save();const w=$('[data-act=welcomed]');if(w)w.textContent=S.allergies.length||S.other.trim()?'Continue':'No allergies — continue'}
 if(t.id&&t.id.startsWith('m-')){const it={name:$('#m-name').value,ingredients:$('#m-ing').value.split(',')};$('#malert').innerHTML=alertHTML(flags(it))}});
document.addEventListener('submit',e=>{if('consent' in e.target.dataset){e.preventDefault();const t=$('#c-terms').checked,h=$('#c-health').checked;
  if(t&&h){S.consent={v:1,at:new Date().toISOString()};cErr='';save();render();syncNav();return maybeOnboard()}
  cErr=t?"Calora needs your OK to store your health information. Without it, the app can't work.":'Calora is for people aged 13 and older who agree to the Terms of Service and Privacy Policy.';render();$('#c-terms').checked=t;$('#c-health').checked=h;return}
 const af=e.target.dataset.authform;if(af){e.preventDefault();af==='chpw'?changePassword():authSubmit(af);return}if(e.target.id==='composer'){e.preventDefault();const i=$('#msg');sendMsg(i.value);i.value=''}});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
$('#sheet').addEventListener('close',()=>{if(sheetKind==='welcome'&&!S.onboarded){S.onboarded=true;save()}});
document.addEventListener('gesturestart',e=>e.preventDefault());
addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(TABS.some(x=>x[0]===t))go(t)});
addEventListener('resize',()=>syncNav());
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.theme==='system')render()});
new MutationObserver(()=>{if(S.theme==='system'&&$('[data-act=theme]'))render()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
render();syncNav();document.fonts?.ready.then(()=>syncNav());
initAuth();
}
</script>
